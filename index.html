<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Daily Trigger Dashboard</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
@import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Inter:wght@400;500;600;700&display=swap');
:root{
  --violet:#8B5CF6;--violet-d:#7C3AED;--violet-900:#4C1D95;
  --violet-50:#F5F3FF;--violet-100:#EDE9FE;--violet-200:#DDD6FE;
  --pink:#EC4899;--pink-50:#FDF2F8;--pink-100:#FCE7F3;
  --mint:#14B8A6;--mint-50:#F0FDFA;--mint-100:#CCFBF1;
  --peach:#FB923C;--peach-50:#FFF7ED;--peach-100:#FFEDD5;
  --sky:#0EA5E9;--sky-50:#F0F9FF;--sky-100:#E0F2FE;
  --shadow-card:0 2px 10px rgba(76,29,149,.07),0 1px 3px rgba(76,29,149,.05),0 0 0 1px rgba(139,92,246,.07)
}
body{font-family:'Inter',system-ui,sans-serif;background:#FFFFFF;color:#1e1b2e;min-height:100vh}
.fade-up{animation:fadeUp .25s ease both}
@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
.kpi{position:relative;border-radius:12px;padding:12px 14px 10px;
  box-shadow:var(--shadow-card);overflow:hidden;border:1px solid var(--violet-100)}
.kpi.c-violet{background:linear-gradient(160deg,var(--violet-50),#fff 70%)}
.kpi.c-mint{background:linear-gradient(160deg,var(--mint-50),#fff 70%)}
.kpi.c-pink{background:linear-gradient(160deg,var(--pink-50),#fff 70%)}
.kpi.c-peach{background:linear-gradient(160deg,var(--peach-50),#fff 70%)}
.kpi-label{font-size:8.5px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--violet-900);margin-bottom:5px}
.kpi-value{font-size:21px;font-weight:700;color:#1e1b2e;letter-spacing:-.03em;font-family:'DM Mono',monospace}
.kpi-sub{font-size:9.5px;color:var(--violet-d);margin-top:2px;font-family:'DM Mono',monospace}
.card{background:#fff;border-radius:12px;border:1px solid var(--violet-100);box-shadow:var(--shadow-card)}
.tab-pill{padding:9px 20px;font-size:12px;font-weight:600;border:none;background:none;cursor:pointer;
  border-bottom:2px solid transparent;color:#7c6f9c;transition:all .12s;font-family:inherit;white-space:nowrap}
.tab-pill.active{color:var(--violet-d);border-bottom-color:var(--violet)}
.tab-pill:hover:not(.active){color:#1e1b2e;background:var(--violet-50)}
table{width:100%;border-collapse:collapse;font-size:11px;table-layout:auto}
th{padding:6px 8px;font-weight:700;font-size:8.5px;text-transform:uppercase;letter-spacing:.06em;
  color:#fff;background:linear-gradient(135deg,var(--violet-d),var(--violet-900));text-align:center;
  border:1px solid rgba(255,255,255,.12);white-space:nowrap;position:sticky;top:0;z-index:2}
th.left{text-align:left}
td{padding:4px 8px;border:1px solid var(--violet-100);font-size:10.5px;text-align:center;
  font-family:'DM Mono',monospace;background:#fff;vertical-align:middle;line-height:1.3}
td.label{text-align:left;font-family:inherit;font-weight:600;color:#1e1b2e;background:#fff;
  position:sticky;left:0;z-index:1;border-right:2px solid var(--violet-200)}
tbody tr:nth-child(even) td{background:var(--violet-50)}
tbody tr:nth-child(even) td.label{background:var(--violet-50)}
tr:hover td{background:var(--pink-100)!important}
tr:hover td.label{background:var(--pink-100)!important}
tr.total-row td{background:linear-gradient(135deg,var(--violet-d),var(--violet-900))!important;color:#fff!important;font-weight:700;border-top:2px solid var(--violet)}
tr.total-row td.label{background:linear-gradient(135deg,var(--violet-d),var(--violet-900))!important;color:#EDE9FE!important;
  position:sticky!important;left:0!important;z-index:6!important}
tr.total-row:hover td{background:linear-gradient(135deg,var(--violet-d),var(--violet-900))!important;color:#fff!important}
tr.total-row:hover td.label{background:linear-gradient(135deg,var(--violet-d),var(--violet-900))!important;color:#EDE9FE!important}
.scroll-x{overflow-x:auto;max-height:70vh;overflow-y:auto}
.filter-bar{display:flex;align-items:center;gap:12px;padding:10px 16px;
  background:linear-gradient(120deg,var(--violet-50),var(--sky-50));border:1px solid var(--violet-200);border-radius:12px;
  margin-bottom:14px;flex-wrap:wrap}
.filter-bar label{font-size:9px;font-weight:700;color:var(--violet-900);text-transform:uppercase;letter-spacing:.08em}
select{border:1px solid var(--violet-200);border-radius:20px;padding:4px 12px;font-size:11px;
  font-family:inherit;outline:none;background:#fff;cursor:pointer;color:#1e1b2e}
select:focus{border-color:var(--violet);box-shadow:0 0 0 2px rgba(139,92,246,.18)}
.btn{border:1px solid var(--violet-200);border-radius:20px;padding:6px 16px;font-size:11px;font-weight:600;
  font-family:inherit;cursor:pointer;background:#fff;color:var(--violet-d)}
.btn:hover{background:var(--violet-50)}
.btn-primary{background:linear-gradient(135deg,var(--violet),var(--pink));color:#fff;border-color:transparent}
.btn-primary:hover{background:linear-gradient(135deg,var(--violet-d),var(--pink))}
.spinner{display:inline-block;width:12px;height:12px;border:2px solid var(--violet-100);
  border-top-color:var(--violet);border-radius:50%;animation:spin .6s linear infinite}
.err-box{background:var(--pink-50);border:1px solid #FBCFE8;color:#9D174D;border-radius:10px;
  padding:10px 14px;font-size:12px;margin-bottom:14px;white-space:pre-wrap}
.muted{color:#8b7fae;font-size:11px}
</style>
</head>
<body>
<div id="root"></div>
<script>
'use strict';

/* ═══════════════════════════════════════════════════════════════════
   GOOGLE SHEETS SYNC CONFIG — Daily Trigger Dashboard
   Hosted on GitHub Pages. Pulls the live lead-level sheet on every
   page load via the gviz CSV export endpoint (no API key needed).
   Sheet must stay shared as "Anyone with the link → Viewer".
   ═══════════════════════════════════════════════════════════════════ */
const SHEETS_CONFIG = Object.freeze({
  SHEET_URL: 'https://docs.google.com/spreadsheets/d/1oXbKagFoARtnHtFVHikHk79buMp3VY_u1tqlvt6U9dc/edit?gid=0#gid=0',
  AUTO_SYNC_ON_LOAD: true,
  AUTO_SYNC_INTERVAL_MS: 0
});

/* ── Google Sheets sync engine ───────────────────────────────────── */
function sheetUrlToCsvUrl(url){
  const u=(url||'').trim();
  if(!u) throw new Error('Sheet URL is empty — paste it in the Sync panel.');
  const idM=u.match(/\/spreadsheets\/d\/([a-zA-Z0-9_\-]+)/);
  if(!idM) throw new Error('Not a valid Google Sheets URL.\nExpected: https://docs.google.com/spreadsheets/d/…');
  const id=idM[1];
  const gidM=u.match(/[#&?]gid=(\d+)/);
  const gid=gidM?gidM[1]:'0';
  return 'https://docs.google.com/spreadsheets/d/'+id+'/gviz/tq?tqx=out:csv&gid='+gid;
}

async function fetchSheetCsv(url){
  const csvUrl=sheetUrlToCsvUrl(url);
  let res;
  try{ res=await fetch(csvUrl,{cache:'no-store'}); }
  catch(e){ throw new Error('Network error — check internet connection. ('+e.message+')'); }
  if(!res.ok){
    if(res.status===401||res.status===403)
      throw new Error('Access denied.\nShare the sheet: File → Share → Anyone with the link → Viewer');
    if(res.status===404)
      throw new Error('Sheet not found. Double-check the URL.');
    throw new Error('Google Sheets fetch failed: HTTP '+res.status);
  }
  const text=await res.text();
  if(!text||text.trim().length<5)
    throw new Error('Sheet returned no data. Make sure it has rows and is publicly shared.');
  if(text.trim().startsWith('<'))
    throw new Error('Sheet returned HTML instead of CSV.\nShare it as "Anyone with the link → Viewer".');
  return text;
}

function parseCsvToRows(csvText){
  if(!window.XLSX) throw new Error('XLSX library not loaded — check internet connection.');
  const wb=window.XLSX.read(csvText,{type:'string',raw:false});
  const ws=wb.Sheets[wb.SheetNames[0]];
  return window.XLSX.utils.sheet_to_json(ws,{defval:'',raw:false});
}

const ce = React.createElement;
const {useState, useEffect, useMemo, useRef, useCallback} = React;

function Nf(n){ return n==null||isNaN(n)?'—':Number(n).toLocaleString('en-IN'); }
function Pf(n,d=1){ return (n==null||isNaN(n))?'—':n.toFixed(d)+'%'; }
function formatDateDMY(iso){
  const m=String(iso||'').match(/^(\d{4})-(\d{2})-(\d{2})/);
  return m?m[3]+'-'+m[2]+'-'+m[1]:iso;
}

/* ── Flexible column getter ──────────────────────────────────────── */
function makeGetter(row){
  const keyMap={};
  for(const k of Object.keys(row)) keyMap[k.toLowerCase().replace(/\s+/g,'').trim()]=k;
  return function(names){
    for(const n of (Array.isArray(names)?names:[names])){
      const nk=n.toLowerCase().replace(/\s+/g,'').trim();
      if(keyMap[nk]!==undefined) return String(row[keyMap[nk]]||'').trim();
    }
    return '';
  };
}

/* ── Parse + normalize a date string to YYYY-MM-DD ───────────────── */
function toISODate(s){
  if(!s) return '';
  s=String(s).trim();
  /* already ISO */
  let m=s.match(/^(\d{4})-(\d{2})-(\d{2})/);
  if(m) return m[1]+'-'+m[2]+'-'+m[3];
  /* Google Sheets gviz CSV export always renders dates as M/D/YYYY (US order),
     regardless of the sheet's locale — confirmed against live export data. */
  m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})/);
  if(m){
    let [,_mo,_d,_y]=m;
    if(_y.length===2) _y='20'+_y;
    return _y+'-'+_mo.padStart(2,'0')+'-'+_d.padStart(2,'0');
  }
  /* dd-mm-yyyy (dash-separated, e.g. manual entry) */
  m=s.match(/^(\d{1,2})-(\d{1,2})-(\d{2,4})/);
  if(m){
    let [,_d,_mo,_y]=m;
    if(_y.length===2) _y='20'+_y;
    return _y+'-'+_mo.padStart(2,'0')+'-'+_d.padStart(2,'0');
  }
  const d=new Date(s);
  if(!isNaN(d.getTime())) return d.toISOString().slice(0,10);
  return s;
}

/* ── Parse raw sheet rows into structured lead records ───────────── */
function parseRows(raw){
  const out=[];
  for(let i=0;i<raw.length;i++){
    const r=raw[i];
    const g=makeGetter(r);
    const idLead = g(['id_lead','id verified lead','id_verified_lead']);
    const brand  = g('brand')||'Unknown';
    const model  = g('model')||'Unknown';
    const leadType = g(['lead_type','lead type'])||'Unknown';
    const source = g(['final_source','source'])||'Unknown';
    const date   = toISODate(g(['triggered_date','triggered date','trig_date','trig date']));
    const mobile = g(['encrypt_mobile_number','encrypted_mobile_number','mobile']);
    if(!date || !mobile) continue;
    out.push({idLead, brand, model, leadType, source, date, mobile, _order:i});
  }
  /* sort by date then original append order, so dedupe follows
     chronological/append sequence — same as the source COUNTIFS column */
  out.sort((a,b)=> a.date<b.date?-1 : a.date>b.date?1 : a._order-b._order);
  const seen=new Map(); /* key: mobile|brand -> running count */
  for(const rec of out){
    const key=rec.mobile+'|'+rec.brand;
    const n=(seen.get(key)||0)+1;
    seen.set(key,n);
    rec.isUnique = n===1;
  }
  return out;
}

/* ── Distinct sorted values for filter dropdowns ─────────────────── */
function distinctSorted(rows,field){
  return Array.from(new Set(rows.map(r=>r[field]))).filter(Boolean).sort();
}

/* ── Pivot rows into date × source grid, counting matched leads ──── */
function pivot(rows, predicate){
  const dateSet=new Set(), sourceSet=new Set();
  const grid={};
  for(const r of rows){
    if(!predicate(r)) continue;
    dateSet.add(r.date); sourceSet.add(r.source);
    grid[r.date]=grid[r.date]||{};
    grid[r.date][r.source]=(grid[r.date][r.source]||0)+1;
  }
  const dates=Array.from(dateSet).sort().reverse();
  const sources=Array.from(sourceSet).sort();
  return {dates, sources, grid};
}

/* ── Sync panel ───────────────────────────────────────────────────── */
function SyncPanel({onSync, syncing, error, lastSynced}){
  return ce('div',{className:'filter-bar',style:{justifyContent:'space-between'}},
    ce('div',{style:{display:'flex',alignItems:'center',gap:10}},
      ce('label',null,'Live Source'),
      ce('span',{className:'muted'},'Google Sheet (gviz CSV export)'),
    ),
    ce('div',{style:{display:'flex',alignItems:'center',gap:10}},
      lastSynced?ce('span',{className:'muted'},'Last synced: '+lastSynced):null,
      ce('button',{className:'btn btn-primary',onClick:onSync,disabled:syncing},
        syncing?ce('span',{className:'spinner'}):'Refresh now')
    )
  );
}

/* ── Multi-select dropdown (checkbox popover) ────────────────────── */
function MultiSelect({label, options, selected, onChange}){
  const [open,setOpen]=useState(false);
  const ref=useRef(null);
  useEffect(function(){
    function onDoc(e){ if(ref.current && !ref.current.contains(e.target)) setOpen(false); }
    document.addEventListener('mousedown',onDoc);
    return ()=>document.removeEventListener('mousedown',onDoc);
  },[]);
  function toggle(o){
    onChange(selected.includes(o)?selected.filter(x=>x!==o):[...selected,o]);
  }
  const text = selected.length===0?('All '+label):(selected.length===1?selected[0]:selected.length+' '+label+' selected');
  return ce('div',{ref, style:{position:'relative'}},
    ce('button',{type:'button',className:'btn',style:{borderRadius:20,minWidth:120,textAlign:'left'},onClick:()=>setOpen(!open)}, text+' ▾'),
    open?ce('div',{style:{position:'absolute',top:'110%',left:0,zIndex:10,background:'#fff',
      border:'1px solid var(--violet-200)',borderRadius:10,boxShadow:'var(--shadow-card)',
      padding:8,minWidth:200,maxHeight:240,overflowY:'auto'}},
      options.length===0?ce('div',{className:'muted',style:{padding:'4px 6px'}},'No options'):null,
      options.map(o=>ce('label',{key:o,style:{display:'flex',alignItems:'center',gap:6,padding:'4px 6px',
        fontSize:11,cursor:'pointer',color:'#1e293b',fontWeight:400,textTransform:'none',letterSpacing:'normal'}},
        ce('input',{type:'checkbox',checked:selected.includes(o),onChange:()=>toggle(o)}),
        o
      )),
      selected.length>0?ce('button',{type:'button',className:'btn',style:{marginTop:6,width:'100%',fontSize:10},
        onClick:()=>onChange([])},'Clear'):null
    ):null
  );
}

/* ── Filter bar (brand single-select / model + lead type multi-select) ── */
function FilterBar({rows, filters, setFilters}){
  const brands = useMemo(()=>distinctSorted(rows,'brand'),[rows]);
  const models = useMemo(()=>distinctSorted(rows.filter(r=>!filters.brand||r.brand===filters.brand),'model'),[rows,filters.brand]);
  const leadTypes = useMemo(()=>distinctSorted(rows,'leadType'),[rows]);
  const hasFilters = filters.brand || filters.model.length || filters.leadType.length;
  return ce('div',{className:'filter-bar'},
    ce('label',null,'Filters'),
    ce('select',{value:filters.brand,onChange:e=>setFilters(f=>({...f,brand:e.target.value,model:[]}))},
      ce('option',{value:''},'All Brands'),
      brands.map(o=>ce('option',{key:o,value:o},o))
    ),
    ce(MultiSelect,{label:'Models', options:models, selected:filters.model, onChange:v=>setFilters(f=>({...f,model:v}))}),
    ce(MultiSelect,{label:'Lead Types', options:leadTypes, selected:filters.leadType, onChange:v=>setFilters(f=>({...f,leadType:v}))}),
    hasFilters?
      ce('button',{className:'btn',onClick:()=>setFilters({brand:'',model:[],leadType:[]})},'Clear filters'):null
  );
}

/* ── Grid table (date rows × source cols) ────────────────────────── */
function GridTable({dates, sources, grid, title}){
  if(!dates.length) return ce('div',{className:'card',style:{padding:24,textAlign:'center'}},
    ce('span',{className:'muted'},'No matching leads for the current filters.'));
  const colTotals={};
  for(const s of sources) colTotals[s]=dates.reduce((sum,d)=>sum+((grid[d]||{})[s]||0),0);
  const grandTotal=sources.reduce((s,c)=>s+colTotals[c],0);
  return ce('div',{className:'card scroll-x fade-up'},
    ce('table',null,
      ce('thead',null,
        ce('tr',null,
          ce('th',{className:'left'},'Trig. Date'),
          sources.map(s=>ce('th',{key:s},s)),
          ce('th',null,'Total')
        )
      ),
      ce('tbody',null,
        ce('tr',{className:'total-row'},
          ce('td',{className:'label'},'Total'),
          sources.map(s=>ce('td',{key:s},Nf(colTotals[s]))),
          ce('td',null,Nf(grandTotal))
        ),
        dates.map(d=>{
          const rowTotal=sources.reduce((s,c)=>s+((grid[d]||{})[c]||0),0);
          return ce('tr',{key:d},
            ce('td',{className:'label'},formatDateDMY(d)),
            sources.map(s=>ce('td',{key:s},Nf((grid[d]||{})[s]||0))),
            ce('td',{style:{fontWeight:700}},Nf(rowTotal))
          );
        })
      )
    )
  );
}

/* ── Main App ─────────────────────────────────────────────────────── */
function App(){
  const [rows,setRows]=useState([]);
  const [syncing,setSyncing]=useState(false);
  const [error,setError]=useState('');
  const [lastSynced,setLastSynced]=useState('');
  const [tab,setTab]=useState('trigger');
  const [filters,setFilters]=useState({brand:'',model:[],leadType:[]});

  const sync=useCallback(async function(){
    setSyncing(true); setError('');
    try{
      const csv=await fetchSheetCsv(SHEETS_CONFIG.SHEET_URL);
      const raw=parseCsvToRows(csv);
      const parsed=parseRows(raw);
      setRows(parsed);
      setLastSynced(new Date().toLocaleString('en-IN'));
    }catch(e){
      setError(e.message||String(e));
    }finally{
      setSyncing(false);
    }
  },[]);

  useEffect(function(){
    if(SHEETS_CONFIG.AUTO_SYNC_ON_LOAD) sync();
    if(SHEETS_CONFIG.AUTO_SYNC_INTERVAL_MS>0){
      const id=setInterval(sync, SHEETS_CONFIG.AUTO_SYNC_INTERVAL_MS);
      return ()=>clearInterval(id);
    }
  },[sync]);

  const filtered = useMemo(()=>rows.filter(r=>
    (!filters.brand||r.brand===filters.brand) &&
    (!filters.model.length||filters.model.includes(r.model)) &&
    (!filters.leadType.length||filters.leadType.includes(r.leadType))
  ),[rows,filters]);

  const triggerPivot = useMemo(()=>pivot(filtered, r=>r.isUnique), [filtered]);
  const duplicatePivot = useMemo(()=>pivot(filtered, r=>!r.isUnique), [filtered]);

  const totalLeads = filtered.length;
  const uniqueLeads = filtered.filter(r=>r.isUnique).length;
  const duplicateLeads = totalLeads-uniqueLeads;

  return ce('div',{style:{maxWidth:1280,margin:'0 auto',padding:'20px 24px'}},
    ce('div',{style:{display:'flex',alignItems:'baseline',justifyContent:'space-between',marginBottom:16}},
      ce('h1',{style:{fontSize:19,fontWeight:700,backgroundImage:'linear-gradient(135deg,var(--violet-d),var(--pink))',
        WebkitBackgroundClip:'text',backgroundClip:'text',color:'transparent'}},'Daily Trigger Dashboard'),
      ce('span',{className:'muted'},'Live from Google Sheets')
    ),
    ce(SyncPanel,{onSync:sync, syncing, error, lastSynced}),
    error?ce('div',{className:'err-box'},error):null,
    rows.length?ce(React.Fragment,null,
      ce('div',{style:{display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:12,marginBottom:16}},
        ce('div',{className:'kpi c-violet'},ce('div',{className:'kpi-label'},'Total Leads'),ce('div',{className:'kpi-value'},Nf(totalLeads))),
        ce('div',{className:'kpi c-mint'},ce('div',{className:'kpi-label'},'Unique Leads'),ce('div',{className:'kpi-value'},Nf(uniqueLeads))),
        ce('div',{className:'kpi c-pink'},ce('div',{className:'kpi-label'},'Duplicate Leads'),ce('div',{className:'kpi-value'},Nf(duplicateLeads))),
        ce('div',{className:'kpi c-peach'},ce('div',{className:'kpi-label'},'Duplicate %'),ce('div',{className:'kpi-value'},Pf(totalLeads?duplicateLeads/totalLeads*100:0)))
      ),
      ce(FilterBar,{rows, filters, setFilters}),
      ce('div',{style:{display:'flex',gap:4,marginBottom:14,borderBottom:'1px solid #DBEAFE'}},
        ce('button',{className:'tab-pill'+(tab==='trigger'?' active':''),onClick:()=>setTab('trigger')},'Day-wise Source-wise Trigger'),
        ce('button',{className:'tab-pill'+(tab==='duplicate'?' active':''),onClick:()=>setTab('duplicate')},'Day-wise Source-wise Duplicate')
      ),
      tab==='trigger'?
        ce(GridTable,{dates:triggerPivot.dates, sources:triggerPivot.sources, grid:triggerPivot.grid}):
        ce(GridTable,{dates:duplicatePivot.dates, sources:duplicatePivot.sources, grid:duplicatePivot.grid})
    ): (!syncing && !error)?ce('div',{className:'card',style:{padding:24,textAlign:'center'}},ce('span',{className:'muted'},'No data loaded yet.')):null
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(ce(App));
</script>
</body>
</html>
