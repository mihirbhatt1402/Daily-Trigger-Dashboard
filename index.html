<script>
'use strict';

  messagingSenderId: "991786510783",

const fbAuth = firebase.auth();
const fbDb = firebase.firestore();
const ONLINE_WINDOW_MS = 2*60*1000; /* heartbeat-based "online" threshold */

/* ═══════════════════════════════════════════════════════════════════
   GOOGLE SHEETS SYNC CONFIG — Daily Trigger Dashboard
   Hosted on GitHub Pages. Pulls the live lead-level sheet on every
   page load via the gviz CSV export endpoint (no API key needed).
   Sheet must stay shared as "Anyone with the link → Viewer".
   ═══════════════════════════════════════════════════════════════════ */
const SHEETS_CONFIG = Object.freeze({
  SHEET_URL: 'https://docs.google.com/spreadsheets/d/1oXbKagFoARtnHtFVHikHk79buMp3VY_u1tqlvt6U9dc/edit?gid=0#gid=0',
  AUTO_SYNC_ON_LOAD: true,
  AUTO_SYNC_INTERVAL_MS: 0
});

const SPENDS_SHEET_URL = 'https://docs.google.com/spreadsheets/d/1oXbKagFoARtnHtFVHikHk79buMp3VY_u1tqlvt6U9dc/edit?gid=1559337629#gid=1559337629';

/* ── Google Sheets sync engine ───────────────────────────────────── */
function sheetUrlToCsvUrl(url){
  const u=(url||'').trim();
  if(!u) throw new Error('Sheet URL is empty — paste it in the Sync panel.');
  const idM=u.match(/\/spreadsheets\/d\/([a-zA-Z0-9_\-]+)/);
  if(!idM) throw new Error('Not a valid Google Sheets URL.\nExpected: https://docs.google.com/spreadsheets/d/…');
  const id=idM[1];
  const gidM=u.match(/[#&?]gid=(\d+)/);
  const gid=gidM?gidM[1]:'0';
  return 'https://docs.google.com/spreadsheets/d/'+id+'/gviz/tq?tqx=out:csv&gid='+gid;
}

async function fetchSheetCsv(url){
  const csvUrl=sheetUrlToCsvUrl(url);
  let res;
  try{ res=await fetch(csvUrl,{cache:'no-store'}); }
  catch(e){ throw new Error('Network error — check internet connection. ('+e.message+')'); }
  if(!res.ok){
    if(res.status===401||res.status===403)
      throw new Error('Access denied.\nShare the sheet: File → Share → Anyone with the link → Viewer');
    if(res.status===404)
      throw new Error('Sheet not found. Double-check the URL.');
    throw new Error('Google Sheets fetch failed: HTTP '+res.status);
  }
  const text=await res.text();
  if(!text||text.trim().length<5)
    throw new Error('Sheet returned no data. Make sure it has rows and is publicly shared.');
  if(text.trim().startsWith('<'))
    throw new Error('Sheet returned HTML instead of CSV.\nShare it as "Anyone with the link → Viewer".');
  return text;
}

function parseCsvToRows(csvText){
  if(!window.XLSX) throw new Error('XLSX library not loaded — check internet connection.');
  const wb=window.XLSX.read(csvText,{type:'string',raw:false});
  const ws=wb.Sheets[wb.SheetNames[0]];
  return window.XLSX.utils.sheet_to_json(ws,{defval:'',raw:false});
}

const ce = React.createElement;
const {useState, useEffect, useMemo, useRef, useCallback} = React;

function Nf(n){ return n==null||isNaN(n)?'—':Number(n).toLocaleString('en-IN'); }
function Pf(n,d=1){ return (n==null||isNaN(n))?'—':n.toFixed(d)+'%'; }
function formatDateDMY(iso){
  const m=String(iso||'').match(/^(\d{4})-(\d{2})-(\d{2})/);
  return m?m[3]+'-'+m[2]+'-'+m[1]:iso;
}
function isoToday(){ return new Date().toISOString().slice(0,10); }
function daysBetween(isoA,isoB){ return Math.round((new Date(isoB)-new Date(isoA))/86400000); }
/* metrics used by Summary tab — all on unique leads only */
function calcBrandMetrics(brandRows){
  const uniqueRows=brandRows.filter(r=>r.isUnique);
  const totalUnique=uniqueRows.length;
  const dates=[...new Set(brandRows.map(r=>r.date))].sort();
  /* Data is always till D-1 (yesterday). Use actual data date range — not today —
     so daysElapsed and currentRR are consistent with the last-3D avg. */
  const firstDate=dates[0]||isoToday();
  const lastDate=dates[dates.length-1]||firstDate;
  const daysElapsed=Math.max(1,daysBetween(firstDate,lastDate)+1);
  const currentRR=totalUnique/daysElapsed;
  /* Last-3D avg = unique leads on last 3 data-dates ÷ number of those dates */
  const last3Dates=dates.slice(-3);
  const last3Unique=last3Dates.length
    ?uniqueRows.filter(r=>last3Dates.includes(r.date)).length/last3Dates.length:0;
  return {totalUnique,daysElapsed,currentRR,last3RR:last3Unique};
}

/* ── Flexible column getter ──────────────────────────────────────── */
function makeGetter(row){
  const keyMap={};
  for(const k of Object.keys(row)) keyMap[k.toLowerCase().replace(/\s+/g,'').trim()]=k;
  return function(names){
    for(const n of (Array.isArray(names)?names:[names])){
      const nk=n.toLowerCase().replace(/\s+/g,'').trim();
      if(keyMap[nk]!==undefined) return String(row[keyMap[nk]]||'').trim();
    }
    return '';
  };
}

/* ── Parse + normalize a date string to YYYY-MM-DD ───────────────── */
function toISODate(s){
  if(!s) return '';
  s=String(s).trim();
  /* already ISO */
  let m=s.match(/^(\d{4})-(\d{2})-(\d{2})/);
  if(m) return m[1]+'-'+m[2]+'-'+m[3];
  /* Google Sheets gviz CSV export always renders dates as M/D/YYYY (US order),
     regardless of the sheet's locale — confirmed against live export data. */
  m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})/);
  if(m){
    let [,_mo,_d,_y]=m;
    if(_y.length===2) _y='20'+_y;
    return _y+'-'+_mo.padStart(2,'0')+'-'+_d.padStart(2,'0');
  }
  /* dd-mm-yyyy (dash-separated, e.g. manual entry) */
  m=s.match(/^(\d{1,2})-(\d{1,2})-(\d{2,4})/);
  if(m){
    let [,_d,_mo,_y]=m;
    if(_y.length===2) _y='20'+_y;
    return _y+'-'+_mo.padStart(2,'0')+'-'+_d.padStart(2,'0');
  }
  /* d-MMM-yyyy (e.g. "1-Apr-2026" from spends sheet) */
  const MON={jan:'01',feb:'02',mar:'03',apr:'04',may:'05',jun:'06',jul:'07',aug:'08',sep:'09',oct:'10',nov:'11',dec:'12'};
  m=s.match(/^(\d{1,2})-([A-Za-z]{3})-(\d{4})$/);
  if(m&&MON[m[2].toLowerCase()]) return m[3]+'-'+MON[m[2].toLowerCase()]+'-'+m[1].padStart(2,'0');
  const d=new Date(s);
  if(!isNaN(d.getTime())) return d.toISOString().slice(0,10);
  return s;
}

/* ── HMSI model-based brand reclassification ─────────────────────── */
/* Slug = only lowercase a-z 0-9, so spacing/hyphens/apostrophes don't matter */
function slugify(s){ return String(s).toLowerCase().replace(/[^a-z0-9]/g,''); }
const HMSI_BW_SLUGS=['cb350rs','cb350','hnesscb350'];          /* CB 350 RS first — longer match wins */
const HMSI_RW_SLUGS=['activa6g','activa125','shine100dx','shine100','shine125','shine','sp125','cb125hornet'];
function reclassifyHMSI(brand,model){
  /* Match only pure Honda/HMSI brands — not "Hero Honda" or other composites */
  if(!/^(honda|hmsi)\b/i.test(brand.trim())) return brand;
  /* Sheet stores model names like "Honda CB350" — strip leading brand prefix */
  let n=slugify(model);
  if(n.startsWith('honda')) n=n.slice(5);
  if(n.startsWith('hmsi')) n=n.slice(4);
  if(HMSI_BW_SLUGS.some(m=>n===m)) return 'HMSI BW';
  return 'HMSI RW';
}

/* ── Parse raw sheet rows into structured lead records ───────────── */
function parseRows(raw){
  const out=[];
  for(let i=0;i<raw.length;i++){
    const r=raw[i];
    const g=makeGetter(r);
    const idLead = g(['id_lead','id verified lead','id_verified_lead']);
    const model  = g('model')||'Unknown';
    const brand  = reclassifyHMSI(g('brand')||'Unknown',model);
    const leadType = g(['lead_type','lead type'])||'Unknown';
    const source = g(['final_source','source'])||'Unknown';
    const city   = g(['verified_city','city'])||'Unknown';
    const state  = g(['state'])||'Unknown';
    const camName = g(['cam_name','cam name'])||'Unknown';
    const isUploaded = g(['is_uploaded','is uploaded'])||'Unknown';
    const date   = toISODate(g(['triggered_date','triggered date','trig_date','trig date']));
    const mobile = g(['encrypt_mobile_number','encrypted_mobile_number','mobile']);
    if(!date || !mobile) continue;
    out.push({idLead, brand, model, leadType, source, city, state, camName, isUploaded, date, mobile, _order:i});
  }
  /* sort by date then original append order, so dedupe follows
     chronological/append sequence — same as the source COUNTIFS column */
  out.sort((a,b)=> a.date<b.date?-1 : a.date>b.date?1 : a._order-b._order);
  const seen=new Map(); /* key: mobile|brand -> running count */
  for(const rec of out){
    const key=rec.mobile+'|'+rec.brand;
    const n=(seen.get(key)||0)+1;
    seen.set(key,n);
    rec.isUnique = n===1;
  }
  return out;
}

/* ── Distinct sorted values for filter dropdowns ─────────────────── */
function distinctSorted(rows,field){
  return Array.from(new Set(rows.map(r=>r[field]))).filter(Boolean).sort();
}

/* ── Fixed display order for the source column; anything else is
   appended alphabetically after these. ──────────────────────────── */
const SOURCE_ORDER = ['Organic','Non MS','MS FB','Adwords','CV','Others','Microsite'];
function sortSources(sources){
  const rank=s=>{ const i=SOURCE_ORDER.findIndex(o=>o.toLowerCase()===String(s).toLowerCase()); return i===-1?SOURCE_ORDER.length:i; };
  return [...sources].sort((a,b)=> rank(a)-rank(b) || a.localeCompare(b));
}

/* ── Pivot rows into date × source grid, counting matched leads ──── */
function pivot(rows, predicate){
  const dateSet=new Set(), sourceSet=new Set();
  const grid={};
  for(const r of rows){
    if(!predicate(r)) continue;
    dateSet.add(r.date); sourceSet.add(r.source);
    grid[r.date]=grid[r.date]||{};
    grid[r.date][r.source]=(grid[r.date][r.source]||0)+1;
  }
  const dates=Array.from(dateSet).sort().reverse();
  const sources=sortSources(Array.from(sourceSet));
  return {dates, sources, grid};
}

/* ── Sync panel ───────────────────────────────────────────────────── */
/* ── Multi-select dropdown (checkbox popover) ────────────────────── */
function MultiSelect({label, options, selected, onChange}){
  const [open,setOpen]=useState(false);
  const ref=useRef(null);
  useEffect(function(){
    function onDoc(e){ if(ref.current && !ref.current.contains(e.target)) setOpen(false); }
    document.addEventListener('mousedown',onDoc);
    return ()=>document.removeEventListener('mousedown',onDoc);
  },[]);
  function toggle(o){
    onChange(selected.includes(o)?selected.filter(x=>x!==o):[...selected,o]);
  }
  const allSelected = options.length>0 && options.every(o=>selected.includes(o));
  function toggleAll(){ onChange(allSelected?[]:options.slice()); }
  const text = selected.length===0?('All '+label):(selected.length===1?selected[0]:selected.length+' '+label+' selected');
  return ce('div',{ref, style:{position:'relative'}},
    ce('button',{type:'button',className:'btn',style:{borderRadius:20,minWidth:120,textAlign:'left'},onClick:()=>setOpen(!open)}, text+' ▾'),
    open?ce('div',{style:{position:'absolute',top:'110%',left:0,zIndex:10,background:'#fff',
      border:'1px solid var(--violet-200)',borderRadius:10,boxShadow:'var(--shadow-card)',
      padding:8,minWidth:200,maxHeight:240,overflowY:'auto'}},
      options.length===0?ce('div',{className:'muted',style:{padding:'4px 6px'}},'No options'):
        ce('label',{style:{display:'flex',alignItems:'center',gap:6,padding:'4px 6px',
          fontSize:11,cursor:'pointer',color:'#1e293b',fontWeight:700,textTransform:'none',letterSpacing:'normal',
          borderBottom:'1px solid var(--violet-100)',marginBottom:4}},
          ce('input',{type:'checkbox',checked:allSelected,onChange:toggleAll}),
          'Select all'
        ),
      options.map(o=>ce('label',{key:o,style:{display:'flex',alignItems:'center',gap:6,padding:'4px 6px',
        fontSize:11,cursor:'pointer',color:'#1e293b',fontWeight:400,textTransform:'none',letterSpacing:'normal'}},
        ce('input',{type:'checkbox',checked:selected.includes(o),onChange:()=>toggle(o)}),
        o
      )),
      selected.length>0?ce('button',{type:'button',className:'btn',style:{marginTop:6,width:'100%',fontSize:10},
        onClick:()=>onChange([])},'Clear'):null
    ):null
  );
}

/* ── Filter bar (brand single-select / model, lead type, city, state, cam name,
   is uploaded multi-select) — each field's option list is narrowed by every
   OTHER currently-active filter, so dropdowns only ever show relevant values ── */
function FilterBar({rows, filters, setFilters}){
  function matches(r, excludeKey){
    return (excludeKey==='brand'||!filters.brand||r.brand===filters.brand) &&
      (excludeKey==='model'||!filters.model.length||filters.model.includes(r.model)) &&
      (excludeKey==='leadType'||!filters.leadType.length||filters.leadType.includes(r.leadType)) &&
      (excludeKey==='state'||!filters.state.length||filters.state.includes(r.state)) &&
      (excludeKey==='city'||!filters.city.length||filters.city.includes(r.city)) &&
      (excludeKey==='camName'||!filters.camName.length||filters.camName.includes(r.camName)) &&
      (excludeKey==='isUploaded'||!filters.isUploaded.length||filters.isUploaded.includes(r.isUploaded));
  }
  const brands = useMemo(()=>distinctSorted(rows.filter(r=>matches(r,'brand')),'brand'),[rows,filters]);
  const models = useMemo(()=>distinctSorted(rows.filter(r=>matches(r,'model')),'model'),[rows,filters]);
  const leadTypes = useMemo(()=>distinctSorted(rows.filter(r=>matches(r,'leadType')),'leadType'),[rows,filters]);
  const states = useMemo(()=>distinctSorted(rows.filter(r=>matches(r,'state')),'state'),[rows,filters]);
  const cities = useMemo(()=>distinctSorted(rows.filter(r=>matches(r,'city')),'city'),[rows,filters]);
  const camNames = useMemo(()=>distinctSorted(rows.filter(r=>matches(r,'camName')),'camName'),[rows,filters]);
  const uploadFlags = useMemo(()=>distinctSorted(rows.filter(r=>matches(r,'isUploaded')),'isUploaded'),[rows,filters]);
  const hasFilters = filters.brand || filters.model.length || filters.leadType.length || filters.state.length ||
    filters.city.length || filters.camName.length || filters.isUploaded.length;

  /* Drop selections that fall outside the now-narrowed option lists
     (e.g. a CAM Name no longer valid once Brand/State change). */
  useEffect(function(){
    setFilters(f=>{
      const next={...f,
        model:f.model.filter(v=>models.includes(v)),
        leadType:f.leadType.filter(v=>leadTypes.includes(v)),
        state:f.state.filter(v=>states.includes(v)),
        city:f.city.filter(v=>cities.includes(v)),
        camName:f.camName.filter(v=>camNames.includes(v)),
        isUploaded:f.isUploaded.filter(v=>uploadFlags.includes(v))
      };
      const changed = Object.keys(next).some(k=>JSON.stringify(next[k])!==JSON.stringify(f[k]));
      return changed?next:f;
    });
  },[models,leadTypes,states,cities,camNames,uploadFlags]);

  return ce('div',{className:'filter-bar'},
    ce('label',null,'Filters'),
    ce('select',{value:filters.brand,onChange:e=>setFilters(f=>({...f,brand:e.target.value,model:[]}))},
      ce('option',{value:''},'All Brands'),
      brands.map(o=>ce('option',{key:o,value:o},o))
    ),
    ce(MultiSelect,{label:'Models', options:models, selected:filters.model, onChange:v=>setFilters(f=>({...f,model:v}))}),
    ce(MultiSelect,{label:'Lead Types', options:leadTypes, selected:filters.leadType, onChange:v=>setFilters(f=>({...f,leadType:v}))}),
    ce(MultiSelect,{label:'States', options:states, selected:filters.state, onChange:v=>setFilters(f=>({...f,state:v,city:[]}))}),
    ce(MultiSelect,{label:'Cities', options:cities, selected:filters.city, onChange:v=>setFilters(f=>({...f,city:v}))}),
    ce(MultiSelect,{label:'CAM Names', options:camNames, selected:filters.camName, onChange:v=>setFilters(f=>({...f,camName:v}))}),
    ce(MultiSelect,{label:'Is Uploaded', options:uploadFlags, selected:filters.isUploaded, onChange:v=>setFilters(f=>({...f,isUploaded:v}))}),
    hasFilters?
      ce('button',{className:'btn',onClick:()=>setFilters({brand:'',model:[],leadType:[],state:[],city:[],camName:[],isUploaded:[]})},'Clear filters'):null
  );
}

/* ── Copy-to-clipboard helper: TSV pastes cleanly into Excel/Sheets ── */
async function copyTsv(rows){
  const tsv=rows.map(r=>r.join('\t')).join('\n');
  try{ await navigator.clipboard.writeText(tsv); return true; }
  catch(e){
    const ta=document.createElement('textarea');
    ta.value=tsv; ta.style.position='fixed'; ta.style.opacity='0';
    document.body.appendChild(ta); ta.select();
    let ok=false; try{ ok=document.execCommand('copy'); }catch(_){}
    document.body.removeChild(ta);
    return ok;
  }
}

/* ── Grid table (date rows × source cols) — supports drag-select +
   copy (Ctrl/Cmd+C or button), TSV format pastes into Excel/Sheets ── */
function GridTable({dates, sources, grid, title, onControls}){
  const [sel,setSel]=useState(null); /* {r0,c0,r1,c1} */
  const draggingRef=useRef(false);
  const wrapRef=useRef(null);
  const [copied,setCopied]=useState(false);

  const colTotals={};
  for(const s of sources) colTotals[s]=dates.reduce((sum,d)=>sum+((grid[d]||{})[s]||0),0);
  const grandTotal=sources.reduce((s,c)=>s+colTotals[c],0);

  /* matrix[0] = header, matrix[1] = grand total, matrix[2..] = date rows */
  const matrix=[
    ['Trig. Date', ...sources, 'Total'],
    ['Total', ...sources.map(s=>String(colTotals[s])), String(grandTotal)],
    ...dates.map(d=>{
      const rowTotal=sources.reduce((s,c)=>s+((grid[d]||{})[c]||0),0);
      return [formatDateDMY(d), ...sources.map(s=>String((grid[d]||{})[s]||0)), String(rowTotal)];
    })
  ];
  const nRows=matrix.length, nCols=matrix[0].length;

  function inSel(r,c){
    if(!sel) return false;
    const r0=Math.min(sel.r0,sel.r1), r1=Math.max(sel.r0,sel.r1);
    const c0=Math.min(sel.c0,sel.c1), c1=Math.max(sel.c0,sel.c1);
    return r>=r0&&r<=r1&&c>=c0&&c<=c1;
  }
  function startSel(r,c){ draggingRef.current=true; setSel({r0:r,c0:c,r1:r,c1:c}); setCopied(false); }
  function extendSel(r,c){ if(draggingRef.current) setSel(s=>s?{...s,r1:r,c1:c}:{r0:r,c0:c,r1:r,c1:c}); }
  function endSel(){ draggingRef.current=false; }

  async function doCopy(){
    let out;
    if(sel){
      const r0=Math.min(sel.r0,sel.r1), r1=Math.max(sel.r0,sel.r1);
      const c0=Math.min(sel.c0,sel.c1), c1=Math.max(sel.c0,sel.c1);
      out=matrix.slice(r0,r1+1).map(row=>row.slice(c0,c1+1));
    }else{
      out=matrix;
    }
    const ok=await copyTsv(out);
    if(ok){ setCopied(true); setTimeout(()=>setCopied(false),1500); }
  }

  useEffect(function(){
    function onKey(e){
      if((e.ctrlKey||e.metaKey) && (e.key==='c'||e.key==='C') && sel){ doCopy(); return; }
      const arrowDelta={ArrowUp:[-1,0],ArrowDown:[1,0],ArrowLeft:[0,-1],ArrowRight:[0,1]}[e.key];
      if(!arrowDelta || !sel) return;
      if(['INPUT','SELECT','TEXTAREA'].includes((document.activeElement||{}).tagName)) return;
      e.preventDefault();
      const [dr,dc]=arrowDelta;
      setSel(s=>{
        if(!s) return s;
        const r1=Math.max(0,Math.min(nRows-1, s.r1+dr));
        const c1=Math.max(0,Math.min(nCols-1, s.c1+dc));
        return e.shiftKey ? {...s, r1, c1} : {r0:r1,c0:c1,r1,c1};
      });
    }
    function onMouseUp(){ endSel(); }
    document.addEventListener('keydown',onKey);
    document.addEventListener('mouseup',onMouseUp);
    return ()=>{ document.removeEventListener('keydown',onKey); document.removeEventListener('mouseup',onMouseUp); };
  },[sel,matrix]);

  useEffect(function(){
    if(onControls) onControls({sel, copied, doCopy});
  },[sel,copied,dates,sources,grid]);

  function td(r,c,content,extra){
    const selected=inSel(r,c);
    const base=(extra&&extra.style)||{};
    return ce('td', Object.assign({}, extra, {
      key:c,
      onMouseDown:(e)=>{ e.preventDefault(); startSel(r,c); },
      onMouseOver:()=>extendSel(r,c),
      style:Object.assign({userSelect:'none',cursor:'cell'}, base,
        selected?{boxShadow:'inset 0 0 0 2px var(--violet)',background:'rgba(139,92,246,.18)'}:{})
    }), content);
  }
  function th(r,c,content,extra){
    const selected=inSel(r,c);
    const base=(extra&&extra.style)||{};
    return ce('th', Object.assign({}, extra, {
      key:c,
      onMouseDown:(e)=>{ e.preventDefault(); startSel(r,c); },
      onMouseOver:()=>extendSel(r,c),
      style:Object.assign({userSelect:'none',cursor:'cell'}, base,
        selected?{boxShadow:'inset 0 0 0 2px #fff'}:{})
    }), content);
  }

  if(!dates.length) return ce('div',{className:'card',style:{padding:24,textAlign:'center'}},
    ce('span',{className:'muted'},'No matching leads for the current filters.'));

  return ce('div',{ref:wrapRef},
    ce('div',{className:'card scroll-x fade-up'},
      ce('table',null,
        ce('thead',null,
          ce('tr',null,
            th(0,0,'Trig. Date',{className:'left'}),
            sources.map((s,i)=>th(0,i+1,s)),
            th(0,nCols-1,'Total')
          )
        ),
        ce('tbody',null,
          ce('tr',{className:'total-row'},
            td(1,0,'Total',{className:'label'}),
            sources.map((s,i)=>td(1,i+1,Nf(colTotals[s]))),
            td(1,nCols-1,Nf(grandTotal))
          ),
          dates.map((d,di)=>{
            const r=di+2;
            const rowTotal=sources.reduce((s,c)=>s+((grid[d]||{})[c]||0),0);
            return ce('tr',{key:d},
              td(r,0,formatDateDMY(d),{className:'label'}),
              sources.map((s,i)=>td(r,i+1,Nf((grid[d]||{})[s]||0))),
              td(r,nCols-1,Nf(rowTotal),{style:{fontWeight:700}})
            );
          })
        )
      )
    )
  );
}

/* ── Aggregate rows into brand → { total per source: {unique,duplicate},
   models: { model → per source: {unique,duplicate} } } ── */
function buildBrandModelAgg(rows){
  const brands={};
  for(const r of rows){
    if(!brands[r.brand]) brands[r.brand]={total:{}, models:{}};
    const b=brands[r.brand];
    const kind=r.isUnique?'unique':'duplicate';
    if(!b.total[r.source]) b.total[r.source]={unique:0,duplicate:0};
    b.total[r.source][kind]++;
    if(!b.models[r.model]) b.models[r.model]={};
    if(!b.models[r.model][r.source]) b.models[r.model][r.source]={unique:0,duplicate:0};
    b.models[r.model][r.source][kind]++;
  }
  return brands;
}
function sumSourceCounts(counts){
  return Object.values(counts).reduce((s,c)=>s+c.unique+c.duplicate,0);
}

/* ── Overview table: Brand × Source (each split into Unique/Duplicate
   sub-columns), brand rows expand/collapse into model rows. Same
   drag-select + copy-as-TSV behavior as GridTable. ── */
function OverviewTable({rows, spendsRows, onControls}){
  const [expanded,setExpanded]=useState(new Set());
  const [sel,setSel]=useState(null);
  const draggingRef=useRef(false);
  const [copied,setCopied]=useState(false);

  const sources = useMemo(()=>sortSources(distinctSorted(rows,'source')),[rows]);
  const agg = useMemo(()=>buildBrandModelAgg(rows),[rows]);
  const brands = useMemo(()=>Object.keys(agg).sort((a,b)=>sumSourceCounts(agg[b].total)-sumSourceCounts(agg[a].total)),[agg]);

  /* ── Spends aggregation ── */
  const spendsMonth = useMemo(function(){
    const ms=[...new Set((spendsRows||[]).map(r=>r.date.slice(0,7)))].sort();
    return ms[ms.length-1]||'';
  },[spendsRows]);

  const spendsMonthLabel = useMemo(function(){
    if(!spendsMonth) return '';
    return new Date(spendsMonth+'-01').toLocaleString('en-IN',{month:'short',year:'numeric'});
  },[spendsMonth]);

  const spendsAgg = useMemo(function(){
    const byBrand={};
    const monthRows=(spendsRows||[]).filter(r=>spendsMonth&&r.date.startsWith(spendsMonth));
    for(const r of monthRows){
      const lb=spendsBrandToLeads(r.brand);
      if(!byBrand[lb]) byBrand[lb]={total:0,rows:[]};
      byBrand[lb].total+=r.cost;
      byBrand[lb].rows.push(r);
    }
    return byBrand;
  },[spendsRows,spendsMonth]);

  function getModelSpend(brand,model){
    const ba=spendsAgg[brand];
    if(!ba) return null;
    const fs=slugify(model||'');
    const bSlug=slugify(brand||'');
    /* When leads store "Royal Enfield Flying Flea C6" but spends store "Flying Flea C6",
       strip the brand prefix from the leads slug for matching. */
    const fsNoBrand=fs.startsWith(bSlug)?fs.slice(bSlug.length):fs;
    let total=0,found=false;
    for(const r of ba.rows){
      const mSlug=slugify(r.model||'');
      /* Skip catch-all rows (model name = brand name); those are handled separately. */
      if(mSlug===slugify(r.brand||'')) continue;
      let match=(mSlug===fs)||(fsNoBrand&&mSlug===fsNoBrand);
      if(!match){ for(const pfx of ['honda','harleydavidson','royalenfield']){
        if(mSlug===pfx+fs||mSlug===pfx+fsNoBrand){match=true;break;} } }
      if(match){total+=r.cost;found=true;}
    }
    return found?total:null;
  }

  /* Unique trigger leads by brand and model from current rows */
  /* T-CPL denominator = paid media trigger leads only (MS FB + Adwords),
     matching the same denominator used in the Day-wise Spends tab. */
  const PAID_SOURCES=new Set(['MS FB','Adwords']);
  const uniqueMap = useMemo(function(){
    const m={};
    for(const r of rows){
      if(!r.isUnique||!PAID_SOURCES.has(r.source)) continue;
      /* Align T-CPL denominator to the same month shown in spendsAgg */
      if(spendsMonth&&r.date&&!r.date.startsWith(spendsMonth)) continue;
      if(!m[r.brand]) m[r.brand]={total:0,models:{}};
      m[r.brand].total++;
      m[r.brand].models[r.model]=(m[r.brand].models[r.model]||0)+1;
    }
    return m;
  },[rows,spendsMonth]);

  /* For brands whose spends are aggregated in one catch-all row (e.g. RE all models
     except Flying Flea), find the model with the most paid unique leads and show the
     catch-all spend + T-CPL there. All other catch-all models show "—". */
  const brandCatchAllInfo=useMemo(function(){
    const info={};
    for(const b of brands){
      const ba=spendsAgg[b];
      if(!ba) continue;
      let catchAllSpend=0;
      for(const r of ba.rows){
        if(slugify(r.model||'')===slugify(r.brand||'')) catchAllSpend+=r.cost;
      }
      if(!catchAllSpend) continue;
      const bModels=(uniqueMap[b]||{}).models||{};
      /* Catch-all models = those without their own specific spend row */
      const caModels=Object.keys(bModels).filter(m=>getModelSpend(b,m)===null);
      if(!caModels.length) continue;
      /* Top model by paid unique leads among catch-all models */
      let topModel=caModels[0],topLeads=bModels[caModels[0]]||0;
      for(const m of caModels){ const cnt=bModels[m]||0; if(cnt>topLeads){topLeads=cnt;topModel=m;} }
      const totalLeads=caModels.reduce((s,m)=>s+(bModels[m]||0),0);
      info[b]={topModel,spend:catchAllSpend,totalLeads};
    }
    return info;
  },[brands,spendsAgg,uniqueMap]);

  function fmtSpend(v){ return v==null||v===0?'—':'₹'+Nf(Math.round(v)); }
  function fmtTcpl(cost,uniq){ return (!cost||!uniq)?'—':'₹'+Math.round(cost/uniq); }

  /* column model: one [source,'unique'/'duplicate'] pair per source,
     plus a trailing Total group with the same two kinds + a combined total */
  const cols=[
    ...sources.flatMap(s=>[{source:s,kind:'unique'},{source:s,kind:'duplicate'}]),
    {source:'Total',kind:'unique'}, {source:'Total',kind:'duplicate'}, {source:'Total',kind:'combined'}
  ];
  function cellVal(counts,col){
    if(col.source==='Total'){
      if(col.kind==='unique') return sources.reduce((s,src)=>s+((counts[src]&&counts[src].unique)||0),0);
      if(col.kind==='duplicate') return sources.reduce((s,src)=>s+((counts[src]&&counts[src].duplicate)||0),0);
      return sumSourceCounts(counts);
    }
    const c=counts[col.source];
    return c?c[col.kind]:0;
  }

  const colTotals=cols.map(col=>brands.reduce((sum,b)=>sum+cellVal(agg[b].total,col),0));

  const displayRows=[];
  for(const b of brands){
    displayRows.push({type:'brand', brand:b, counts:agg[b].total});
    if(expanded.has(b)){
      const models=Object.keys(agg[b].models).sort((m1,m2)=>sumSourceCounts(agg[b].models[m2])-sumSourceCounts(agg[b].models[m1]));
      for(const m of models) displayRows.push({type:'model', brand:b, model:m, counts:agg[b].models[m]});
    }
  }

  /* header groups: each source spans its Unique/Duplicate pair (colSpan 2),
     the trailing Total group spans Unique/Duplicate/All (colSpan 3) */
  const headerGroups=[];
  { let i=0;
    for(const s of sources){ headerGroups.push({label:s, colStart:i, span:2}); i+=2; }
    headerGroups.push({label:'Total', colStart:i, span:3}); i+=3;
  }
  const groupLabelRow=new Array(cols.length).fill('');
  for(const g of headerGroups) groupLabelRow[g.colStart]=g.label;
  const subLabelRow=cols.map(col=>col.kind==='unique'?'Unique':col.kind==='duplicate'?'Duplicate':'All');

  const matrix=[
    ['Brand', ...groupLabelRow],
    ['', ...subLabelRow],
    ['Total', ...colTotals.map(String)],
    ...displayRows.map(dr=>{
      const label = dr.type==='brand'?dr.brand:('  '+dr.model);
      return [label, ...cols.map(col=>String(cellVal(dr.counts,col)))];
    })
  ];
  const nRows=matrix.length, nCols=matrix[0].length;

  function inSel(r,c){
    if(!sel) return false;
    const r0=Math.min(sel.r0,sel.r1), r1=Math.max(sel.r0,sel.r1);
    const c0=Math.min(sel.c0,sel.c1), c1=Math.max(sel.c0,sel.c1);
    return r>=r0&&r<=r1&&c>=c0&&c<=c1;
  }
  function startSel(r,c){ draggingRef.current=true; setSel({r0:r,c0:c,r1:r,c1:c}); setCopied(false); }
  function extendSel(r,c){ if(draggingRef.current) setSel(s=>s?{...s,r1:r,c1:c}:{r0:r,c0:c,r1:r,c1:c}); }
  function endSel(){ draggingRef.current=false; }

  async function doCopy(){
    let out;
    if(sel){
      const r0=Math.min(sel.r0,sel.r1), r1=Math.max(sel.r0,sel.r1);
      const c0=Math.min(sel.c0,sel.c1), c1=Math.max(sel.c0,sel.c1);
      out=matrix.slice(r0,r1+1).map(row=>row.slice(c0,c1+1));
    }else{
      out=matrix;
    }
    const ok=await copyTsv(out);
    if(ok){ setCopied(true); setTimeout(()=>setCopied(false),1500); }
  }

  useEffect(function(){
    function onKey(e){
      if((e.ctrlKey||e.metaKey) && (e.key==='c'||e.key==='C') && sel){ doCopy(); return; }
      const arrowDelta={ArrowUp:[-1,0],ArrowDown:[1,0],ArrowLeft:[0,-1],ArrowRight:[0,1]}[e.key];
      if(!arrowDelta || !sel) return;
      if(['INPUT','SELECT','TEXTAREA'].includes((document.activeElement||{}).tagName)) return;
      e.preventDefault();
      const [dr,dc]=arrowDelta;
      setSel(s=>{
        if(!s) return s;
        const r1=Math.max(0,Math.min(nRows-1, s.r1+dr));
        const c1=Math.max(0,Math.min(nCols-1, s.c1+dc));
        return e.shiftKey ? {...s, r1, c1} : {r0:r1,c0:c1,r1,c1};
      });
    }
    function onMouseUp(){ endSel(); }
    document.addEventListener('keydown',onKey);
    document.addEventListener('mouseup',onMouseUp);
    return ()=>{ document.removeEventListener('keydown',onKey); document.removeEventListener('mouseup',onMouseUp); };
  },[sel,matrix]);

  useEffect(function(){
    if(onControls) onControls({sel, copied, doCopy});
  },[sel,copied,rows]);

  function td(r,c,content,extra){
    const selected=inSel(r,c);
    const base=(extra&&extra.style)||{};
    return ce('td', Object.assign({}, extra, {
      key:c,
      onMouseDown:(e)=>{ e.preventDefault(); startSel(r,c); },
      onMouseOver:()=>extendSel(r,c),
      style:Object.assign({userSelect:'none',cursor:'cell'}, base,
        selected?{boxShadow:'inset 0 0 0 2px var(--violet)',background:'rgba(139,92,246,.18)'}:{})
    }), content);
  }
  function th(r,c,content,extra){
    const selected=inSel(r,c);
    const base=(extra&&extra.style)||{};
    return ce('th', Object.assign({}, extra, {
      key:c,
      onMouseDown:(e)=>{ e.preventDefault(); startSel(r,c); },
      onMouseOver:()=>extendSel(r,c),
      style:Object.assign({userSelect:'none',cursor:'cell'}, base,
        selected?{boxShadow:'inset 0 0 0 2px #fff'}:{})
    }), content);
  }
  function toggle(b){
    setExpanded(s=>{ const n=new Set(s); n.has(b)?n.delete(b):n.add(b); return n; });
  }

  function subHeaderCell(col,i){
    return th(1,i+1, col.kind==='unique'?'Unique':col.kind==='duplicate'?'Duplicate':'All',
      col.kind==='duplicate'?{style:{background:'linear-gradient(135deg,#9D5FE8,#6D28D9)',top:24}}:{style:{top:24}});
  }
  function colCell(r,counts,col,i,extra){
    return td(r,i+1,Nf(cellVal(counts,col)), Object.assign({},extra,
      col.kind==='duplicate'?{style:Object.assign({},(extra&&extra.style)||{},{background:'#FAF5FF'})}:{}));
  }

  if(!brands.length) return ce('div',{className:'card',style:{padding:24,textAlign:'center'}},
    ce('span',{className:'muted'},'No matching leads for the current filters.'));

  const spendsBorder={borderLeft:'2px solid #C4B5FD'};

  /* Total spends across all brands in current spends month */
  const totalBrandSpend=brands.reduce((s,b)=>(spendsAgg[b]?s+spendsAgg[b].total:s),0);
  const totalUnique=rows.filter(r=>r.isUnique&&PAID_SOURCES.has(r.source)&&(!spendsMonth||r.date.startsWith(spendsMonth))).length;

  return ce('div',null,
    ce('div',{className:'card scroll-x fade-up'},
      ce('table',null,
        ce('thead',null,
          ce('tr',null,
            th(0,0,'Brand',{className:'left',rowSpan:2}),
            headerGroups.map(g=>th(0,g.colStart+1,g.label,{colSpan:g.span})),
            spendsMonthLabel?ce('th',{colSpan:2,style:{...spendsBorder,top:0}},
              'Spends ('+spendsMonthLabel+')'):null
          ),
          ce('tr',null,
            cols.map((col,i)=>subHeaderCell(col,i)),
            spendsMonthLabel?[
              ce('th',{key:'sc',style:{...spendsBorder,top:24}},'Total ₹'),
              ce('th',{key:'tc',style:{top:24}},'T-CPL')
            ]:null
          )
        ),
        ce('tbody',null,
          ce('tr',{className:'total-row'},
            td(2,0,'Total',{className:'label'}),
            cols.map((col,i)=>td(2,i+1,Nf(colTotals[i]))),
            spendsMonthLabel?[
              ce('td',{key:'ts',style:{...spendsBorder,fontWeight:700}},fmtSpend(totalBrandSpend)),
              ce('td',{key:'tt',style:{fontWeight:700}},fmtTcpl(totalBrandSpend,totalUnique))
            ]:null
          ),
          displayRows.map((dr,i)=>{
            const r=i+3;
            const labelContent = dr.type==='brand'?
              ce('span',{style:{display:'flex',alignItems:'center',gap:6}},
                ce('button',{type:'button',
                  onClick:(e)=>{ e.stopPropagation(); toggle(dr.brand); },
                  style:{border:'none',background:'none',cursor:'pointer',padding:0,
                    fontSize:11,color:'var(--violet-d)',width:14}},
                  expanded.has(dr.brand)?'▾':'▸'),
                ce('span',{style:{fontWeight:700}},dr.brand)
              ):
              ce('span',{style:{paddingLeft:20,color:'#5b5070'}},dr.model);

            let spendCells=null;
            if(spendsMonthLabel){
              if(dr.type==='brand'){
                const bs=(spendsAgg[dr.brand]||{}).total||0;
                const bu=(uniqueMap[dr.brand]||{}).total||0;
                spendCells=[
                  ce('td',{key:'bs',style:{...spendsBorder,fontWeight:700}},fmtSpend(bs)),
                  ce('td',{key:'bt',style:{fontWeight:700}},fmtTcpl(bs,bu))
                ];
              } else {
                const ms=getModelSpend(dr.brand,dr.model);
                if(ms!=null){
                  /* Model has its own specific spend row (e.g. RE Flying Flea) */
                  const mu=(uniqueMap[dr.brand]&&uniqueMap[dr.brand].models[dr.model])||0;
                  spendCells=[
                    ce('td',{key:'ms',style:spendsBorder},fmtSpend(ms)),
                    ce('td',{key:'mt'},fmtTcpl(ms,mu))
                  ];
                } else {
                  /* Check if this is the top catch-all model for its brand */
                  const bca=brandCatchAllInfo[dr.brand];
                  const isCaTop=bca&&bca.topModel===dr.model;
                  spendCells=[
                    ce('td',{key:'ms',style:spendsBorder},isCaTop?fmtSpend(bca.spend):'—'),
                    ce('td',{key:'mt'},isCaTop?fmtTcpl(bca.spend,bca.totalLeads):'—')
                  ];
                }
              }
            }

            return ce('tr',{key:dr.type+dr.brand+(dr.model||'')},
              td(r,0,labelContent,{className:'label'}),
              cols.map((col,i2)=>colCell(r,dr.counts,col,i2,
                col.kind==='combined'?{style:{fontWeight:dr.type==='brand'?700:400}}:null)),
              spendCells
            );
          })
        )
      )
    )
  );
}

/* ── Target-config modal (admin only) ────────────────────────────── */
function ConfigModal({brand,brandRows,config,onSave,onClose}){
  const [level,setLevel]=useState((config&&config.level)||'brand');
  const [entries,setEntries]=useState((config&&config.entries)||{});
  const [saving,setSaving]=useState(false);
  const [err,setErr]=useState('');
  const models=useMemo(()=>[...new Set(brandRows.map(r=>r.model))].filter(Boolean).sort(),[brandRows]);
  const cams=useMemo(()=>[...new Set(brandRows.map(r=>r.camName))].filter(Boolean).sort(),[brandRows]);
  function setEntry(key,field,val){ setEntries(e=>({...e,[key]:{...(e[key]||{}),[field]:val}})); }
  function handleSave(){
    setSaving(true); setErr('');
    console.log('[Save] clicked | brand:', brand, '| level:', level, '| entries:', JSON.stringify(entries));
    /* Wrap onSave inside Promise.resolve().then() so any synchronous throw from
       the Firestore SDK is converted to a rejected Promise — otherwise a sync
       throw escapes Promise.race entirely and the spinner hangs forever. */
    const saveP=Promise.resolve().then(function(){ return onSave(brand,{level,entries}); });
    const timeout=new Promise(function(_,rej){
      setTimeout(function(){ rej(new Error('Save timed out after 8 s. Check internet connection and Firestore rules.')); },8000);
    });
    Promise.race([saveP,timeout])
      .then(function(){
        console.log('[Save] SUCCESS');
        setSaving(false); onClose();
      })
      .catch(function(e){
        console.error('[Save] FAILED — code:', e.code, '| message:', e.message, '| stack:', e.stack);
        setSaving(false);
        /* Surface Firestore permission errors with actionable text */
        const msg=e.code==='permission-denied'
          ?'Permission denied. Ask the dashboard owner to add a Firestore rule allowing writes to users/{uid}.'
          :e.code==='not-found'
          ?'User document missing. Please sign out and back in, then retry.'
          :e.message||String(e);
        setErr(msg);
      });
  }
  const keys=level==='brand'?['_brand']:level==='model'?models:cams;
  const iStyle={border:'1px solid var(--violet-200)',borderRadius:6,padding:'5px 8px',
    fontSize:12,outline:'none',width:'100%'};
  const lvlBtns=[['brand','Brand'],['model','Model'],['cam','CAM Name']].map(([l,lbl],i,arr)=>
    ce('button',{key:l,type:'button',onClick:()=>{ setLevel(l); setEntries({}); },
      style:{padding:'7px 18px',fontSize:11,fontWeight:600,fontFamily:'inherit',
        border:'1px solid var(--violet-200)',borderLeft:i===0?undefined:'none',
        borderRadius:i===0?'8px 0 0 8px':i===arr.length-1?'0 8px 8px 0':'0',
        cursor:'pointer',
        background:level===l?'linear-gradient(135deg,var(--violet),var(--pink))':'#fff',
        color:level===l?'#fff':'var(--violet-d)'}},lbl)
  );
  const gridCols=level==='brand'?'1fr 130px 160px':'180px 130px 160px';
  return ce('div',{style:{position:'fixed',top:0,left:0,right:0,bottom:0,
    background:'rgba(30,27,46,.5)',backdropFilter:'blur(4px)',
    zIndex:1000,display:'flex',alignItems:'center',justifyContent:'center'}},
    ce('div',{style:{background:'#fff',borderRadius:16,padding:28,maxWidth:580,
      width:'92%',maxHeight:'82vh',overflowY:'auto',
      boxShadow:'0 8px 40px rgba(76,29,149,.22)',border:'1px solid var(--violet-100)'}},
      ce('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:18}},
        ce('h2',{style:{fontSize:15,fontWeight:700,color:'#1e1b2e'}},'Set Target — '+brand),
        ce('button',{className:'btn',style:{fontSize:11,padding:'4px 12px'},onClick:onClose},'✕')
      ),
      ce('div',{style:{marginBottom:20}},
        ce('div',{style:{fontSize:10,fontWeight:700,color:'var(--violet-900)',marginBottom:8,
          textTransform:'uppercase',letterSpacing:'.08em'}},'Track targets at'),
        ce('div',{style:{display:'flex'}},lvlBtns)
      ),
      ce('div',{style:{marginBottom:20}},
        ce('div',{style:{display:'grid',gridTemplateColumns:gridCols,gap:'4px 10px',
          alignItems:'center',marginBottom:8,paddingBottom:6,borderBottom:'2px solid var(--violet-200)'}},
          level!=='brand'?ce('div',{style:{fontSize:9,fontWeight:700,color:'var(--violet-900)',
            textTransform:'uppercase',letterSpacing:'.07em'}},level==='model'?'Model':'CAM Name'):null,
          ce('div',{style:{fontSize:9,fontWeight:700,color:'var(--violet-900)',textTransform:'uppercase',letterSpacing:'.07em'}},'Lead Target'),
          ce('div',{style:{fontSize:9,fontWeight:700,color:'var(--violet-900)',textTransform:'uppercase',letterSpacing:'.07em'}},'Campaign End Date')
        ),
        keys.map(function(key){
          const entry=entries[key]||{};
          return ce('div',{key:key||'__brand',
            style:{display:'grid',gridTemplateColumns:gridCols,gap:'4px 10px',
              alignItems:'center',padding:'8px 0',borderBottom:'1px solid var(--violet-100)'}},
            level!=='brand'?ce('div',{style:{fontSize:12,fontWeight:500,color:'#1e1b2e'}},key):null,
            ce('input',{type:'number',min:0,value:entry.target||'',
              onChange:e=>setEntry(key,'target',e.target.value),placeholder:'—',
              style:Object.assign({},iStyle,{fontFamily:"'DM Mono',monospace",textAlign:'right'})}),
            ce('input',{type:'date',value:entry.endDate||'',
              onChange:e=>setEntry(key,'endDate',e.target.value),
              style:iStyle})
          );
        })
      ),
      err?ce('div',{className:'err-box',style:{marginBottom:10}},err):null,
      ce('div',{style:{display:'flex',gap:8,justifyContent:'flex-end'}},
        ce('button',{className:'btn',onClick:onClose,disabled:saving},'Cancel'),
        ce('button',{className:'btn btn-primary',onClick:handleSave,disabled:saving},
          saving?ce('span',{className:'spinner'}):null,saving?' Saving…':'Save targets')
      )
    )
  );
}

/* ── Summary tab: per-brand KPI tracking with per-brand target config ─ */
function SummaryTab({rows,isAdmin}){
  const [configs,setConfigs]=useState({});
  const [configuring,setConfiguring]=useState(null);

  useEffect(function(){
    /* Configs live in settings/campaignConfigs — a shared doc readable by ALL
       authenticated users and writable only by the admin. This is the single
       source of truth so every user sees identical Summary data. */
    const unsub=fbDb.collection('settings').doc('campaignConfigs').onSnapshot(
      function(snap){
        console.log('[Configs] loaded — exists:', snap.exists, '| keys:', snap.exists?Object.keys(snap.data().configs||{}).join(', '):'none');
        setConfigs(snap.exists?(snap.data().configs||{}):{});
      },
      function(e){
        console.error('[Configs] read failed — code:', e.code, '| message:', e.message);
        setConfigs({});
      }
    );
    return unsub;
  },[]);

  function saveConfig(brand,config){
    const uid=fbAuth.currentUser&&fbAuth.currentUser.uid;
    console.log('[saveConfig] uid:', uid, '| brand:', brand, '| config:', JSON.stringify(config));
    if(!uid) return Promise.reject(new Error('Not signed in — please refresh and sign in again.'));
    /* Write to shared settings/campaignConfigs doc. FieldPath safely handles
       brand names with spaces (e.g. "Royal Enfield"). */
    const ref=fbDb.collection('settings').doc('campaignConfigs');
    const fp=new firebase.firestore.FieldPath('configs',brand);
    console.log('[saveConfig] writing to settings/campaignConfigs → configs.'+brand);
    return ref.update(fp,config)
      .then(function(){ console.log('[saveConfig] update() OK'); })
      .catch(function(e){
        console.warn('[saveConfig] update() failed — code:', e.code, e.message);
        if(e.code==='not-found'){
          /* First-ever save — document doesn't exist yet, create it */
          console.log('[saveConfig] doc not-found, creating with set+merge');
          return ref.set({configs:{[brand]:config}},{merge:true});
        }
        throw e;
      });
  }

  const brands=useMemo(function(){
    const counts={};
    for(const r of rows) if(r.isUnique) counts[r.brand]=(counts[r.brand]||0)+1;
    return Object.keys(counts).sort((a,b)=>(counts[b]||0)-(counts[a]||0));
  },[rows]);

  const byBrand=useMemo(function(){
    const m={};
    for(const r of rows){ if(!m[r.brand])m[r.brand]=[]; m[r.brand].push(r); }
    return m;
  },[rows]);

  const today=isoToday();

  /* Returns 6 <td> elements: unique, elapsed, current RR, 3D avg, req RR, days left */
  function kpiCells(entityRows,entry){
    const m=calcBrandMetrics(entityRows);
    const numT=Number((entry||{}).target)||0;
    const ed=(entry||{}).endDate||'';
    /* +1 so both today and the campaign end date are counted as active days */
    const rawDl=ed?daysBetween(today,ed)+1:null;
    const dl=rawDl!==null?Math.max(0,rawDl):null;
    const expired=rawDl!==null&&rawDl<0;
    const rr=(numT>0&&dl>0)?Math.max(0,numT-m.totalUnique)/dl:null;
    const onP=rr!==null&&m.currentRR>=rr;
    return [
      ce('td',{key:'u'},Nf(m.totalUnique)),
      ce('td',{key:'e'},m.daysElapsed+'d'),
      ce('td',{key:'c'},m.currentRR.toFixed(1)+'/d'),
      ce('td',{key:'l'},m.last3RR.toFixed(1)+'/d'),
      ce('td',{key:'r',style:rr!==null?{color:onP?'#065F46':'#9A3412',fontWeight:700}:expired?{color:'#6B7280'}:{}},
        rr!==null?rr.toFixed(1)+'/d':expired?'Ended':'—'),
      ce('td',{key:'d',style:expired?{color:'#6B7280'}:dl!==null&&dl<=3?{color:'#9A3412',fontWeight:700}:{}},
        expired?'Ended':dl!==null?dl+'d':'—')
    ];
  }

  function editBtn(brand){
    if(!isAdmin) return null;
    const has=!!(configs[brand]&&configs[brand].level);
    return ce('button',{type:'button',onClick:()=>setConfiguring(brand),
      style:{marginLeft:8,fontSize:10,padding:'2px 8px',border:'1px solid var(--violet-200)',
        borderRadius:10,background:'none',cursor:'pointer',color:'var(--violet-d)',
        fontFamily:'inherit',verticalAlign:'middle'}},
      has?'✎ Edit':'+ Set target');
  }

  /* Returns array of <tr> elements for this brand */
  function renderBrand(brand){
    const br=byBrand[brand]||[];
    const cfg=configs[brand]||{};
    const lvl=cfg.level;
    const ent=cfg.entries||{};

    if(!lvl){
      return [ce('tr',{key:brand+':nc'},
        ce('td',{className:'label'},ce('span',{style:{fontWeight:700}},brand),editBtn(brand)),
        ce('td',null,'—'),ce('td',null,'—'),...kpiCells(br,{})
      )];
    }
    if(lvl==='brand'){
      const e=ent['_brand']||{};
      return [ce('tr',{key:brand+':b'},
        ce('td',{className:'label'},ce('span',{style:{fontWeight:700}},brand),editBtn(brand)),
        ce('td',null,e.target?Nf(Number(e.target)):'—'),
        ce('td',null,e.endDate?formatDateDMY(e.endDate):'—'),
        ...kpiCells(br,e)
      )];
    }
    const isModel=lvl==='model';
    const subKeys=isModel
      ?[...new Set(br.map(r=>r.model))].filter(Boolean).sort()
      :[...new Set(br.map(r=>r.camName))].filter(Boolean).sort();
    /* Totals for the brand: sum of all sub-targets, latest end date, all-brand rows */
    const totalTarget=subKeys.reduce((s,k)=>s+(Number((ent[k]||{}).target)||0),0);
    const latestEnd=subKeys.reduce((mx,k)=>{ const ed=(ent[k]||{}).endDate||''; return ed>mx?ed:mx; },'');
    const totalEntry={target:String(totalTarget),endDate:latestEnd};
    return [
      ce('tr',{key:brand+':hdr'},
        ce('td',{className:'label',colSpan:9,
          style:{background:'var(--violet-50)',color:'var(--violet-900)',fontWeight:700,fontStyle:'italic',
            borderBottom:'2px solid var(--violet-200)'}},
          brand+' — '+(isModel?'Model targets':'CAM targets'),
          editBtn(brand)
        )
      ),
      ...subKeys.map(function(key){
        const subR=isModel?br.filter(r=>r.model===key):br.filter(r=>r.camName===key);
        const e=ent[key]||{};
        return ce('tr',{key:brand+'|'+key},
          ce('td',{className:'label',style:{paddingLeft:22,fontWeight:400,color:'#5b5070',fontSize:11}},key),
          ce('td',null,e.target?Nf(Number(e.target)):'—'),
          ce('td',null,e.endDate?formatDateDMY(e.endDate):'—'),
          ...kpiCells(subR,e)
        );
      }),
      /* Totals row — summed target, latest end date, all brand rows for metrics */
      ce('tr',{key:brand+':total',className:'total-row'},
        ce('td',{className:'label',style:{paddingLeft:22}},brand+' Total'),
        ce('td',null,totalTarget?Nf(totalTarget):'—'),
        ce('td',null,latestEnd?formatDateDMY(latestEnd):'—'),
        ...kpiCells(br,totalEntry)
      )
    ];
  }

  if(!brands.length) return ce('div',{className:'card',style:{padding:24,textAlign:'center'}},
    ce('span',{className:'muted'},'No matching leads for the current filters.'));

  return ce('div',{className:'fade-up'},
    configuring?ce(ConfigModal,{
      brand:configuring,brandRows:byBrand[configuring]||[],
      config:configs[configuring],
      onSave:saveConfig,onClose:()=>setConfiguring(null)
    }):null,
    ce('div',{className:'card scroll-x'},
      ce('table',null,
        ce('thead',null,
          ce('tr',null,
            ce('th',{className:'left'},'Brand / Entity'),
            ce('th',null,'Lead Target'),
            ce('th',null,'Campaign End'),
            ce('th',null,'Unique Leads'),
            ce('th',null,'Days Elapsed'),
            ce('th',null,'Current RR'),
            ce('th',null,'Last 3D Avg RR'),
            ce('th',null,'Req. Daily RR'),
            ce('th',null,'Days Left')
          )
        ),
        ce('tbody',null,brands.flatMap(b=>renderBrand(b)))
      )
    )
  );
}

/* ── Spends brand name → leads dashboard brand name mapping ─────── */
const SPENDS_BRAND_MAP={
  'royal enfield':'Royal Enfield',
  'ola':'Ola Electric',
  'hmsi bigwing':'HMSI BW',
  'hmsi redwing':'HMSI RW',
  'harley':'Harley-Davidson',
};
function spendsBrandToLeads(b){
  return SPENDS_BRAND_MAP[String(b||'').toLowerCase().trim()]||b;
}

/* ── Parse spends sheet rows ─────────────────────────────────────── */
function parseSpends(raw){
  return raw.map(function(row){
    const g=makeGetter(row);
    const segment=g(['Segment','segment']);
    const buType=g(['BU Type','bu type','BUType','butype']);
    const day=g(['Day','day']);
    const cost=parseFloat(String(g(['Cost','cost'])||'0').replace(/[₹,]/g,''))||0;
    const leads=parseFloat(String(g(['Leads','leads'])||'0').replace(/,/g,''))||0;
    const monthRaw=g(['Month','month']);
    const brand=g(['Brand','brand']);
    const model=g(['Model','model']);
    const accountName=g(['Account name','account name','AccountName','accountname']);
    return {segment,buType,accountName,date:toISODate(day),cost,leads,month:monthRaw,brand,model};
  }).filter(function(r){ return r.segment.toLowerCase().trim()==='bikes' && r.date; });
}

/* ── Spends Tab ──────────────────────────────────────────────────── */
function SpendsTab({spendsRows, rows, filters}){
  /* Filter by brand, then model with per-brand fallback:
     if no spends model matches the leads model filter for a given brand
     (e.g. Ola whose spends are brand-level "Ola Electric"), show all
     rows for that brand rather than hiding them entirely. */
  const filteredSpends=useMemo(function(){
    const brandFiltered=spendsRows.filter(function(r){
      if(!filters.brand) return true;
      return spendsBrandToLeads(r.brand)===filters.brand;
    });
    if(!filters.model||!filters.model.length) return brandFiltered;
    /* Group by spends brand, apply model filter per group */
    const byBrand={};
    for(const r of brandFiltered){
      if(!byBrand[r.brand]) byBrand[r.brand]=[];
      byBrand[r.brand].push(r);
    }
    const result=[];
    for(const brandRows of Object.values(byBrand)){
      const modelMatched=brandRows.filter(function(r){
        const mSlug=slugify(r.model||'');
        return filters.model.some(function(fm){
          const fs=slugify(fm);
          if(mSlug===fs) return true;
          /* Leads sheet may store models without brand prefix
             (e.g. "Activa 6G") while spends uses "Honda Activa 6G".
             Try stripping known brand prefixes from spends slug before comparing.
             This avoids both double-counting and silent misses. */
          for(const pfx of ['honda','harleydavidson','royalenfield']){
            if(mSlug===pfx+fs) return true;
          }
          return false;
        });
      });
      /* If no exact model match: fall back to catch-all rows (where model name
         equals brand name, e.g. RE "Royal Enfield" or Harley "Harley"), NOT all
         brand rows — otherwise RE "Bullet 350" filter would incorrectly include
         Flying Flea spends that have their own dedicated model row. */
      const catchAllRows=brandRows.filter(function(r){
        return slugify(r.model||'')===slugify(r.brand||'');
      });
      result.push(...(modelMatched.length?modelMatched:(catchAllRows.length?catchAllRows:brandRows)));
    }
    return result;
  },[spendsRows,filters]);

  const months=useMemo(function(){
    return [...new Set(filteredSpends.map(r=>r.date.slice(0,7)))].sort();
  },[filteredSpends]);

  const [selMonth,setSelMonth]=useState('');
  useEffect(function(){
    if(months.length) setSelMonth(m=>m||months[months.length-1]);
  },[months]);

  const monthLabel=useMemo(function(){
    if(!selMonth) return '';
    return new Date(selMonth+'-01').toLocaleString('en-IN',{month:'short',year:'numeric'});
  },[selMonth]);

  const filtered=useMemo(function(){
    return filteredSpends.filter(r=>r.date.startsWith(selMonth));
  },[filteredSpends,selMonth]);

  const spendMap=useMemo(function(){
    const m={};
    for(const r of filtered){
      const bt=String(r.buType||'').trim();
      const isNA=bt==='#N/A'||bt==='';
      const acct=String(r.accountName||'').trim().toLowerCase();
      /* BU Type #N/A + Account name "Media Sales -AUTO" → MS FB */
      const ch=bt==='Media Sales-FB'||(isNA&&acct.includes('auto'))?'fb':
               bt==='Media Sales-GA'||(isNA&&!acct.includes('auto'))?'adwords':null;
      if(!ch) continue;
      if(!m[r.date]) m[r.date]={fb:{cost:0,genLeads:0},adwords:{cost:0,genLeads:0}};
      m[r.date][ch].cost+=r.cost;
      m[r.date][ch].genLeads+=r.leads;
    }
    return m;
  },[filtered]);

  const triggerMap=useMemo(function(){
    const m={};
    for(const r of rows.filter(r=>r.isUnique&&r.date&&r.date.startsWith(selMonth))){
      const ch=r.source==='MS FB'?'fb':r.source==='Adwords'?'adwords':null;
      if(!ch) continue;
      if(!m[r.date]) m[r.date]={fb:0,adwords:0};
      m[r.date][ch]++;
    }
    return m;
  },[rows,selMonth]);

  const dates=useMemo(function(){
    return Object.keys(spendMap).sort().reverse();
  },[spendMap]);

  const totals=useMemo(function(){
    let fbCost=0,fbGen=0,fbTrig=0,awCost=0,awGen=0,awTrig=0;
    for(const dt of dates){
      const sp=spendMap[dt];
      const tr=triggerMap[dt]||{fb:0,adwords:0};
      fbCost+=sp.fb.cost; fbGen+=sp.fb.genLeads; fbTrig+=tr.fb;
      awCost+=sp.adwords.cost; awGen+=sp.adwords.genLeads; awTrig+=tr.adwords;
    }
    /* Include trigger leads on dates that have leads but no spends (e.g. today),
       so Total T-CPL denominator matches Overview tab exactly. */
    for(const dt of Object.keys(triggerMap)){
      if(!spendMap[dt]){ fbTrig+=triggerMap[dt].fb; awTrig+=triggerMap[dt].adwords; }
    }
    return {fbCost,fbGen,fbTrig,awCost,awGen,awTrig,
      totCost:fbCost+awCost,totGen:fbGen+awGen,totTrig:fbTrig+awTrig};
  },[dates,spendMap,triggerMap]);

  function fmtCost(n){ return n?'₹'+Nf(Math.round(n)):'—'; }
  function fmtCpl(cost,leads){ return (cost&&leads)?'₹'+(cost/leads).toFixed(0):'—'; }
  function fmtUtil(trig,gen){ return (gen&&trig!=null)?Math.round(trig/gen*100)+'%':'—'; }

  function renderRow(dt,isTotal){
    const sp=isTotal?null:(spendMap[dt]||{fb:{cost:0,genLeads:0},adwords:{cost:0,genLeads:0}});
    const tr=isTotal?null:(triggerMap[dt]||{fb:0,adwords:0});
    const fbCost=isTotal?totals.fbCost:sp.fb.cost;
    const fbGen=isTotal?totals.fbGen:sp.fb.genLeads;
    const fbTrig=isTotal?totals.fbTrig:tr.fb;
    const awCost=isTotal?totals.awCost:sp.adwords.cost;
    const awGen=isTotal?totals.awGen:sp.adwords.genLeads;
    const awTrig=isTotal?totals.awTrig:tr.adwords;
    const totCost=fbCost+awCost,totGen=fbGen+awGen,totTrig=fbTrig+awTrig;
    return ce('tr',{key:isTotal?'__total':dt,className:isTotal?'total-row':''},
      ce('td',{className:'label'},isTotal?'Total':formatDateDMY(dt)),
      ce('td',null,fmtCost(fbCost)),
      ce('td',null,fbGen?Nf(Math.round(fbGen)):'—'),
      ce('td',null,fmtCpl(fbCost,fbGen)),
      ce('td',null,fmtCpl(fbCost,fbTrig)),
      ce('td',null,fmtUtil(fbTrig,fbGen)),
      ce('td',null,fmtCost(awCost)),
      ce('td',null,awGen?Nf(Math.round(awGen)):'—'),
      ce('td',null,fmtCpl(awCost,awGen)),
      ce('td',null,fmtCpl(awCost,awTrig)),
      ce('td',null,fmtUtil(awTrig,awGen)),
      ce('td',null,fmtCost(totCost)),
      ce('td',null,totGen?Nf(Math.round(totGen)):'—'),
      ce('td',null,fmtCpl(totCost,totGen)),
      ce('td',null,fmtCpl(totCost,totTrig)),
      ce('td',null,fmtUtil(totTrig,totGen))
    );
  }

  return ce('div',null,
    ce('div',{style:{display:'flex',alignItems:'center',gap:10,marginBottom:10,flexWrap:'wrap'}},
      ce('span',{style:{fontSize:12,fontWeight:700,color:'var(--violet-d)',textTransform:'uppercase',letterSpacing:'.06em'}},
        'Day-wise Spends'+(monthLabel?' — '+monthLabel:'')),
      ce('select',{value:selMonth,onChange:function(e){setSelMonth(e.target.value);}},
        months.map(function(mo){
          return ce('option',{key:mo,value:mo},
            new Date(mo+'-01').toLocaleString('en-IN',{month:'short',year:'numeric'}));
        })

    ce('div',{className:'card scroll-x fade-up'},
      ce('table',null,
        ce('thead',null,
          ce('tr',null,
            ce('th',{className:'left',rowSpan:2},'Date'),
            ce('th',{colSpan:5},'MS FB'),
            ce('th',{colSpan:5},'Adwords'),
            ce('th',{colSpan:5},'Total')
          ),
          ce('tr',null,
            ce('th',null,'Spends'), ce('th',null,'Gen Leads'), ce('th',null,'G-CPL'), ce('th',null,'T-CPL'), ce('th',null,'Util%'),
            ce('th',null,'Spends'), ce('th',null,'Gen Leads'), ce('th',null,'G-CPL'), ce('th',null,'T-CPL'), ce('th',null,'Util%'),
            ce('th',null,'Spends'), ce('th',null,'Gen Leads'), ce('th',null,'G-CPL'), ce('th',null,'T-CPL'), ce('th',null,'Util%')
          )

        ce('tbody',null,

            ? ce('tr',null,ce('td',{colSpan:16,className:'label',style:{padding:20,textAlign:'center',fontWeight:400,color:'#9CA3AF'}},

            : dates.map(function(dt){ return renderRow(dt,false); })
        )
      )
    )
  );
}

/* ── Revenue Tab ─────────────────────────────────────────────────── */
function RevenueTab({spendsRows,rows,filters}){
  const {useState:S,useEffect:E,useMemo:M}=React;
  const [cfg,setCfg]=S({});

  /* Load rates & lead orders from Firestore */
  E(function(){
    const unsub=fbDb.collection('settings').doc('revenueRates').onSnapshot(function(snap){
      if(snap.exists) setCfg(snap.data()||{});
    });
    return unsub;
  },[]);

  /* Latest spends month */
  const spendsMonth=M(function(){
    if(!spendsRows||!spendsRows.length) return '';
    const months=[...new Set(spendsRows.filter(r=>r.date).map(r=>r.date.slice(0,7)))].sort();
    return months[months.length-1];
  },[spendsRows]);

  /* Brands from the trigger/leads sheet brand column */
  const brands=M(function(){
    const all=[...new Set(rows.map(r=>r.brand).filter(Boolean))].sort();
    return filters.brand?all.filter(b=>b===filters.brand):all;
  },[rows,filters]);

  /* Spends MTD per brand */
  const spendsAgg=M(function(){
    const m={};
    (spendsRows||[]).filter(r=>spendsMonth&&r.date.startsWith(spendsMonth)).forEach(function(r){
      const lb=spendsBrandToLeads(r.brand);
      m[lb]=(m[lb]||0)+r.cost;
    });
    return m;
  },[spendsRows,spendsMonth]);

  /* All unique trigger leads MTD per brand across all sources */
  const leadsMTD=M(function(){
    const m={};
    rows.forEach(function(r){
      if(!r.isUnique||!r.date||!r.date.startsWith(spendsMonth)) return;
      m[r.brand]=(m[r.brand]||0)+1;
    });
    return m;
  },[rows,spendsMonth]);

  /* Persist a single field change for a brand */
  function save(brand,field,val){
    const next={...cfg,[brand]:{...(cfg[brand]||{}),[field]:val}};
    setCfg(next);
    fbDb.collection('settings').doc('revenueRates').set(next,{merge:false});
  }

  function fmtINR(n){ return n?'₹'+Nf(Math.round(n)):'—'; }
  function fmtGM(rev,spends){
    if(!rev) return '—';
    const g=(rev-spends)/rev*100;
    const color=g>=0?'#166534':'#9D174D';
    return ce('span',{style:{color,fontWeight:700}},g.toFixed(1)+'%');
  }

  /* Totals */
  const totLeadOrder=brands.reduce((s,b)=>s+(parseFloat((cfg[b]||{}).leadOrder)||0),0);
  const totRevOrder=brands.reduce(function(s,b){
    const c=cfg[b]||{};
    return s+(parseFloat(c.leadOrder)||0)*(parseFloat(c.rate)||0);
  },0);
  const totLeads=brands.reduce((s,b)=>s+(leadsMTD[b]||0),0);
  const totRevMTD=brands.reduce(function(s,b){
    const c=cfg[b]||{};
    return s+(leadsMTD[b]||0)*(parseFloat(c.rate)||0);
  },0);
  const totSpends=brands.reduce((s,b)=>s+(spendsAgg[b]||0),0);

  const thS={style:{top:0}};
  const inputS={type:'number',min:0,style:{width:90,border:'1px solid var(--violet-200)',borderRadius:4,
    padding:'2px 6px',fontSize:10.5,fontFamily:"'DM Mono',monospace",textAlign:'right',
    background:'#FAF5FF',outline:'none'}};

  return ce('div',null,
    ce('div',{className:'card scroll-x fade-up'},
      ce('table',null,
        ce('thead',null,
          ce('tr',null,
            ce('th',{...thS,className:'left'},'Account'),
            ce('th',thS,'Lead Order'),
            ce('th',thS,'Revenue Order'),
            ce('th',thS,'Rate'),
            ce('th',thS,'Leads MTD'),
            ce('th',thS,'Revenue MTD'),
            ce('th',thS,'Spends MTD'),
            ce('th',thS,'GM%')
          )
        ),
        ce('tbody',null,
          /* Total row */
          ce('tr',{className:'total-row'},
            ce('td',{className:'label'},'Total'),
            ce('td',null,totLeadOrder?Nf(totLeadOrder):'—'),
            ce('td',null,fmtINR(totRevOrder)),
            ce('td',null,'—'),
            ce('td',null,Nf(totLeads)),
            ce('td',null,fmtINR(totRevMTD)),
            ce('td',null,fmtINR(totSpends)),
            ce('td',null,fmtGM(totRevMTD,totSpends))
          ),
          brands.map(function(brand){
            const c=cfg[brand]||{};
            const rate=parseFloat(c.rate)||0;
            const leadOrder=parseFloat(c.leadOrder)||0;
            const revOrder=leadOrder*rate;
            const leads=leadsMTD[brand]||0;
            const revMTD=leads*rate;
            const spendsMTDv=spendsAgg[brand]||0;
            return ce('tr',{key:brand},
              ce('td',{className:'label'},brand),
              /* Lead Order — editable */
              ce('td',null,ce('input',Object.assign({},inputS,{
                value:c.leadOrder||'',
                onChange:function(e){ save(brand,'leadOrder',e.target.value); }
              }))),
              ce('td',null,fmtINR(revOrder)),
              /* Rate — editable */
              ce('td',null,ce('input',Object.assign({},inputS,{
                value:c.rate||'',
                onChange:function(e){ save(brand,'rate',e.target.value); }
              }))),
              ce('td',null,Nf(leads)),
              ce('td',null,fmtINR(revMTD)),
              ce('td',null,fmtINR(spendsMTDv)),
              ce('td',null,fmtGM(revMTD,spendsMTDv))
            );
          })
        )
      )
    )
  );
}

/* ── Main App ─────────────────────────────────────────────────────── */
function App({topBar,isAdmin}){
  const [rows,setRows]=useState([]);
  const [spendsRows,setSpendsRows]=useState([]);
  const [syncing,setSyncing]=useState(false);
  const [error,setError]=useState('');
  const [lastSynced,setLastSynced]=useState('');
  const [tab,setTab]=useState('overview');
  const [filters,setFilters]=useState({brand:'',model:[],leadType:[],state:[],city:[],camName:[],isUploaded:[]});
  const [tableControls,setTableControls]=useState(null);
  function switchTab(t){ setTableControls(null); setTab(t); }

  const sync=useCallback(async function(){
    setSyncing(true); setError('');
    try{
      const [csv,spendsCsv]=await Promise.all([
        fetchSheetCsv(SHEETS_CONFIG.SHEET_URL),
        fetchSheetCsv(SPENDS_SHEET_URL).catch(function(){ return ''; })
      ]);
      const raw=parseCsvToRows(csv);
      const parsed=parseRows(raw);
      setRows(parsed);
      if(spendsCsv){
        try{
          const sRaw=parseCsvToRows(spendsCsv);
          setSpendsRows(parseSpends(sRaw));
        }catch(e2){ console.warn('[Spends] parse error',e2); }
      }
      setLastSynced(new Date().toLocaleString('en-IN'));
    }catch(e){
      setError(e.message||String(e));
    }finally{
      setSyncing(false);
    }
  },[]);

  useEffect(function(){
    if(SHEETS_CONFIG.AUTO_SYNC_ON_LOAD) sync();
    if(SHEETS_CONFIG.AUTO_SYNC_INTERVAL_MS>0){
      const id=setInterval(sync, SHEETS_CONFIG.AUTO_SYNC_INTERVAL_MS);
      return ()=>clearInterval(id);
    }
  },[sync]);

  const filtered = useMemo(()=>rows.filter(r=>
    (!filters.brand||r.brand===filters.brand) &&
    (!filters.model.length||filters.model.includes(r.model)) &&
    (!filters.leadType.length||filters.leadType.includes(r.leadType)) &&
    (!filters.state.length||filters.state.includes(r.state)) &&
    (!filters.city.length||filters.city.includes(r.city)) &&
    (!filters.camName.length||filters.camName.includes(r.camName)) &&
    (!filters.isUploaded.length||filters.isUploaded.includes(r.isUploaded))
  ),[rows,filters]);

  const triggerPivot = useMemo(()=>pivot(filtered, r=>r.isUnique), [filtered]);
  const duplicatePivot = useMemo(()=>pivot(filtered, r=>!r.isUnique), [filtered]);

  const totalLeads = filtered.length;
  const uniqueLeads = filtered.filter(r=>r.isUnique).length;
  const duplicateLeads = totalLeads-uniqueLeads;

  return ce('div',{style:{maxWidth:'100%',margin:'0 auto',padding:'20px 24px'}},
    topBar,
    ce('div',{style:{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:16,flexWrap:'wrap',gap:10}},
      ce('div',{style:{display:'flex',alignItems:'center',gap:10}},
        ce('img',{src:'logo.png',alt:'BikeDekho',style:{height:48,width:'auto'}}),
        ce('h1',{style:{fontSize:19,fontWeight:700,backgroundImage:'linear-gradient(135deg,var(--violet-d),var(--pink))',
          WebkitBackgroundClip:'text',backgroundClip:'text',color:'transparent'}},'Bikes | Enterprise | Daily Trigger Dashboard')
      ),
      ce('div',{style:{display:'flex',alignItems:'center',gap:10}},
        lastSynced?ce('span',{className:'muted'},'Last synced: '+lastSynced):null,
        ce('button',{className:'btn btn-primary',onClick:sync,disabled:syncing},
          syncing?ce('span',{className:'spinner'}):'Refresh now')
      )
    ),
    error?ce('div',{className:'err-box'},error):null,
    rows.length?ce(React.Fragment,null,
      ce('div',{style:{display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:12,marginBottom:16}},
        ce('div',{className:'kpi c-violet'},ce('div',{className:'kpi-label'},'Total Leads'),ce('div',{className:'kpi-value'},Nf(totalLeads))),
        ce('div',{className:'kpi c-mint'},ce('div',{className:'kpi-label'},'Unique Leads'),ce('div',{className:'kpi-value'},Nf(uniqueLeads))),
        ce('div',{className:'kpi c-pink'},ce('div',{className:'kpi-label'},'Duplicate Leads'),ce('div',{className:'kpi-value'},Nf(duplicateLeads))),
        ce('div',{className:'kpi c-peach'},ce('div',{className:'kpi-label'},'Duplicate %'),ce('div',{className:'kpi-value'},Pf(totalLeads?duplicateLeads/totalLeads*100:0)))
      ),
      ce(FilterBar,{rows, filters, setFilters}),
      ce('div',{style:{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:14,
        borderBottom:'1px solid #DBEAFE',flexWrap:'wrap',gap:8}},
        ce('div',{style:{display:'flex',gap:4}},
          ce('button',{className:'tab-pill'+(tab==='summary'?' active':''),onClick:()=>switchTab('summary')},'Summary'),
          ce('button',{className:'tab-pill'+(tab==='overview'?' active':''),onClick:()=>switchTab('overview')},'Overview'),
          ce('button',{className:'tab-pill'+(tab==='trigger'?' active':''),onClick:()=>switchTab('trigger')},'Day-wise Source-wise Trigger'),
          ce('button',{className:'tab-pill'+(tab==='duplicate'?' active':''),onClick:()=>switchTab('duplicate')},'Day-wise Source-wise Duplicate'),
          ce('button',{className:'tab-pill'+(tab==='spends'?' active':''),onClick:()=>switchTab('spends')},'Day-wise Spends'),
          ce('button',{className:'tab-pill'+(tab==='revenue'?' active':''),onClick:()=>switchTab('revenue')},'Revenue')
        ),
        (tab!=='summary'&&tableControls)?ce('button',{className:'btn',style:{marginBottom:8},onClick:tableControls.doCopy},
          tableControls.copied?'Copied ✓':(tableControls.sel?'Copy selection':'Copy whole grid')):null
      ),
      tab==='summary'?
        ce(SummaryTab,{rows:filtered,isAdmin}):
      tab==='overview'?
        ce(OverviewTable,{rows:filtered, spendsRows, onControls:setTableControls}):
      tab==='trigger'?
        ce(GridTable,{dates:triggerPivot.dates, sources:triggerPivot.sources, grid:triggerPivot.grid, onControls:setTableControls}):
      tab==='duplicate'?
        ce(GridTable,{dates:duplicatePivot.dates, sources:duplicatePivot.sources, grid:duplicatePivot.grid, onControls:setTableControls}):
      tab==='spends'?
        ce(SpendsTab,{spendsRows,rows:filtered,filters}):
        ce(RevenueTab,{spendsRows,rows:filtered,filters})
    ): (!syncing && !error)?ce('div',{className:'card',style:{padding:24,textAlign:'center'}},ce('span',{className:'muted'},'No data loaded yet.')):null
  );
}

/* ── Admin panel: approve / deny / revoke access, see who's online ── */
function AdminPanel(){
  const [users,setUsers]=useState([]);
  const [now,setNow]=useState(Date.now());

  useEffect(function(){
    const unsub=fbDb.collection('users').onSnapshot(snap=>{
      setUsers(snap.docs.map(d=>({uid:d.id, ...d.data()})));
    });
    const tick=setInterval(()=>setNow(Date.now()),15000);
    return ()=>{ unsub(); clearInterval(tick); };
  },[]);

  function setStatus(uid,status){ fbDb.collection('users').doc(uid).update({status}); }
  function tsToMs(ts){ return ts && ts.toMillis ? ts.toMillis() : 0; }
  function isOnline(u){ return (now - tsToMs(u.lastActive)) < ONLINE_WINDOW_MS; }
  function relTime(ts){
    const ms=tsToMs(ts); if(!ms) return '—';
    const mins=Math.round((now-ms)/60000);
    if(mins<1) return 'just now';
    if(mins<60) return mins+'m ago';
    const hrs=Math.round(mins/60);
    if(hrs<24) return hrs+'h ago';
    return Math.round(hrs/24)+'d ago';
  }

  const sorted=[...users].sort((a,b)=>(a.status==='pending'?0:1)-(b.status==='pending'?0:1) || (a.email||'').localeCompare(b.email||''));
  const onlineCount=users.filter(isOnline).length;

  return ce('div',{style:{maxWidth:900,margin:'0 auto',padding:'20px 24px'}},
    ce('h1',{style:{fontSize:18,fontWeight:700,color:'#1e1b2e',marginBottom:4}},'Access Admin'),
    ce('div',{className:'muted',style:{marginBottom:16}},
      users.length+' total · '+onlineCount+' online now'),
    ce('div',{className:'card'},
      ce('table',null,
        ce('thead',null,
          ce('tr',null,
            ce('th',{className:'left'},'User'),
            ce('th',null,'Status'),
            ce('th',null,'Requested'),
            ce('th',null,'Last Active'),
            ce('th',null,'Actions')
          )
        ),
        ce('tbody',null,
          sorted.length===0?ce('tr',null,ce('td',{colSpan:5,style:{padding:18}},'No sign-ins yet.')):
          sorted.map(u=>ce('tr',{key:u.uid},
            ce('td',{className:'left',style:{textAlign:'left'}},
              ce('span',{className:'online-dot'+(isOnline(u)?' live':'')}),
              u.email||u.uid
            ),
            ce('td',null,ce('span',{className:'status-badge status-'+(u.status||'pending')},u.status||'pending')),
            ce('td',null,relTime(u.requestedAt)),
            ce('td',null,relTime(u.lastActive)),
            ce('td',null,
              u.email===ADMIN_EMAIL?ce('span',{className:'muted'},'admin'):
              ce('div',{style:{display:'flex',gap:6,justifyContent:'center'}},
                u.status!=='approved'?ce('button',{className:'btn',style:{fontSize:10,padding:'4px 10px'},onClick:()=>setStatus(u.uid,'approved')},'Approve'):null,
                u.status!=='denied'?ce('button',{className:'btn',style:{fontSize:10,padding:'4px 10px'},onClick:()=>setStatus(u.uid,'denied')},'Deny / Revoke'):null
              )
            )
          ))
        )
      )
    )
  );
}

/* ── Auth gate: Google sign-in, Firestore-backed approval workflow ── */
function AuthGate(){
  const [user,setUser]=useState(undefined); /* undefined = checking, null = signed out */
  const [profile,setProfile]=useState(undefined);
  const [showAdmin,setShowAdmin]=useState(false);
  const [signInErr,setSignInErr]=useState('');

  useEffect(()=>fbAuth.onAuthStateChanged(setUser),[]);

  useEffect(function(){
    if(!user){ setProfile(user===null?null:undefined); return; }
    const ref=fbDb.collection('users').doc(user.uid);
    const unsub=ref.onSnapshot(function(snap){
      if(!snap.exists){
        ref.set({
          email:user.email, name:user.displayName||'', status:'pending',
          requestedAt:firebase.firestore.FieldValue.serverTimestamp(),
          lastActive:firebase.firestore.FieldValue.serverTimestamp()
        });
      }else{
        setProfile(snap.data());
      }
    });
    return unsub;
  },[user]);

  const isAdmin = user && user.email===ADMIN_EMAIL;
  const approved = isAdmin || (profile && profile.status==='approved');

  /* heartbeat while approved + tab open */
  useEffect(function(){
    if(!user || !approved) return;
    const ref=fbDb.collection('users').doc(user.uid);
    const beat=()=>ref.set({lastActive:firebase.firestore.FieldValue.serverTimestamp()},{merge:true});
    beat();
    const id=setInterval(beat,60000);
    return ()=>clearInterval(id);
  },[user,approved]);

  function signIn(){
    setSignInErr('');
    fbAuth.signInWithPopup(new firebase.auth.GoogleAuthProvider()).catch(e=>setSignInErr(e.message));
  }
  function signOut(){ fbAuth.signOut(); }

  if(user===undefined) return ce('div',{className:'gate-screen'},ce('span',{className:'spinner'}));

  if(!user) return ce('div',{className:'gate-screen'},
    ce('div',{className:'gate-card'},
      ce('div',{className:'gate-icon'},'🔒'),
      ce('h2',{style:{fontSize:17,marginBottom:8,color:'#1e1b2e'}},'Daily Trigger Dashboard'),
      ce('p',{className:'muted',style:{marginBottom:18}},'Sign in with your Google account to request access.'),
      ce('button',{className:'btn btn-primary',onClick:signIn},'Sign in with Google'),
      signInErr?ce('div',{className:'err-box',style:{marginTop:14,marginBottom:0}},signInErr):null
    )
  );

  if(!isAdmin && profile===undefined) return ce('div',{className:'gate-screen'},ce('span',{className:'spinner'}));

  if(!approved){
    const status = profile?profile.status:'pending';
    return ce('div',{className:'gate-screen'},
      ce('div',{className:'gate-card'},
        ce('div',{className:'gate-icon'},status==='denied'?'🚫':'⏳'),
        ce('h2',{style:{fontSize:17,marginBottom:8,color:'#1e1b2e'}},
          status==='denied'?'Access denied':'Waiting for approval'),
        ce('p',{className:'muted',style:{marginBottom:18}},
          status==='denied'
            ?'Your access request was declined. Contact the dashboard owner if you believe this is a mistake.'
            :'Your request is pending. The dashboard owner needs to approve '+user.email+' before you can view the data.'),
        ce('button',{className:'btn',onClick:signOut},'Sign out')
      )
    );
  }

  const topBar = ce('div',{className:'top-bar'},
    ce('span',null,user.email),
    isAdmin?ce('button',{className:'btn',style:{fontSize:10,padding:'4px 12px'},onClick:()=>setShowAdmin(s=>!s)},
      showAdmin?'Back to dashboard':'Admin panel'):null,
    ce('button',{className:'btn',style:{fontSize:10,padding:'4px 12px'},onClick:signOut},'Sign out')
  );

  return (isAdmin && showAdmin) ? AdminPanelWithBar(topBar) : ce(App,{topBar,isAdmin});
}
function AdminPanelWithBar(topBar){
  return ce('div',null, ce('div',{style:{maxWidth:900,margin:'0 auto',padding:'12px 24px 0'}},topBar), ce(AdminPanel));
}

ReactDOM.createRoot(document.getElementById('root')).render(ce(AuthGate));
</script>
